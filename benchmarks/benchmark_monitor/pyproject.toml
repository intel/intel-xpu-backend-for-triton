[project]
name = "benchmark-monitor"
version = "0.1.0"
readme = "README.md"
description = "Nightly benchmark regression monitoring: model, catalog, aggregation, gate."
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]  # jsonschema: test_schema_agrees_with_loader

[tool.setuptools]
packages = ["benchmark_monitor"]

[tool.setuptools.package-data]
benchmark_monitor = ["catalog/*.yaml", "catalog/*.json"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
