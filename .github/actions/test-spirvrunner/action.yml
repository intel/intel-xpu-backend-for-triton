name: test-spirvrunner
description: Build SPIRVRunner and run its tests
runs:
  using: "composite"
  steps:
    - name: Install CMake
      shell: bash
      run: |
        pip install cmake -c python/requirements.txt

    - name: Prepare LLVM cache key
      shell: bash
      run: |
        LLVM_HASH="$(sha256sum cmake/llvm-info.json | cut -d\  -f1)"
        TRITON_LLVM_CACHE_KEY=$(echo $LLVM_HASH ${{ hashFiles('setup.py') }} | sha256sum - | cut -d\  -f1)
        echo "TRITON_LLVM_CACHE_KEY=$TRITON_LLVM_CACHE_KEY" | tee -a $GITHUB_ENV

    - name: Load LLVM from Triton cache
      id: llvm-cache
      uses: ./.github/actions/load
      env:
        # Keep in sync with CACHE_NUMBER in .github/actions/setup-triton
        CACHE_NUMBER: 1
      with:
        path: $HOME/.triton/llvm
        key: triton-llvm-${{ env.TRITON_LLVM_CACHE_KEY }}-${{ env.CACHE_NUMBER }}

    - name: Download LLVM
      shell: bash
      run: |
        python python/build_helpers.py write_thirdparty_cmake_vars --triton-cache-path $HOME/.triton --packages llvm --output $RUNNER_TEMP/llvm.cmake

    - name: Save LLVM to Triton cache
      if: steps.llvm-cache.outputs.status == 'miss'
      uses: ./.github/actions/save
      with:
        path: ${{ steps.llvm-cache.outputs.path }}
        dest: ${{ steps.llvm-cache.outputs.dest }}

    - name: Build SPIRVRunner
      shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
      run: |
        set -x
        export LLVM_DIR="$HOME/.triton/llvm/llvm-ubuntu-x64"
        export CMAKE_PREFIX_PATH="$(python scripts/torch_cmake.py)"
        cd utils/SPIRVRunner
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
        make -j

    - name: Test SPIRVRunner
      shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
      run: |
        set -x
        pip install pytest
        export SPIRV_RUNNER_PATH="$GITHUB_WORKSPACE/utils/SPIRVRunner/build/SPIRVRunner"
        export SPIRV_RUNNER_TESTS="$GITHUB_WORKSPACE/utils/SPIRVRunner/tests"
        cd utils/SPIRVRunner
        pytest tests/test_spirv_runner.py
