# Clones PyTorch (or loads from cache) to directory "pytorch".
# Uses the existing Python.
# Within one workflow run, one job can upload the wheel (upload_artifact) and the others install it (download_artifact).
# Across runs, a cache miss installs the wheel that wheels-pytorch-linux.yml built on main when the cache key matches.
# Sets the following environment variables:
# * PYTORCH_REPO
# * PYTORCH_COMMIT_ID
# * PYTORCH_VERSION
name: setup-pytorch
description: Build and install PyTorch wheels
inputs:
  oneapi:
    description: Directory with oneAPI BaseKit
    default: /opt/intel/oneapi
  repository:
    description: Repository name with owner
    default: pytorch/pytorch
  ref:
    description: Branch, tag, commit id
    default: ""
  mode:
    description: Source or wheels
    default: source
  cache:
    description: "enabled, read-only (load from cache, never save) or disabled"
    default: enabled
  lts:
    description: Build for LTS driver (limits TORCH_XPU_ARCH_LIST to pvc only)
    default: "false"
  upload_artifact:
    description: Upload the PyTorch wheel as an artifact with this name (source mode), keep empty to skip
    default: ""
  download_artifact:
    description: >
      On a cache miss, install the PyTorch wheel from the artifact with this name instead of building it
      (source mode); the source tree is cloned without submodules. Keep empty to build.
    default: ""
outputs:
  pytorch_cache_key:
    description: "PyTorch cache key, the producer's key when the wheel came from download_artifact"
    value: ${{ steps.find-wheel.outputs.pytorch_cache_key || steps.generate-pytorch-cache-key.outputs.pytorch_cache_key }}
runs:
  using: "composite"
  steps:
    - name: Set default commit id
      if: inputs.ref == ''
      shell: bash
      run: |
        PYTORCH_COMMIT_ID="$(<.github/pins/pytorch.txt)"
        echo "PYTORCH_REPO=${{ inputs.repository }}" | tee -a "$GITHUB_ENV"
        echo "PYTORCH_COMMIT_ID=$PYTORCH_COMMIT_ID" | tee -a "$GITHUB_ENV"

    - name: Identify commit id
      if: inputs.ref != ''
      id: commit-id
      uses: ./.github/actions/get-commit-id
      with:
        repository: ${{ inputs.repository }}
        branch: ${{ inputs.ref }}

    - name: Set commit id
      if: inputs.ref != ''
      shell: bash
      run: |
        echo "PYTORCH_REPO=${{ inputs.repository }}" | tee -a "$GITHUB_ENV"
        echo "PYTORCH_COMMIT_ID=${{ steps.commit-id.outputs.commit_id }}" | tee -a "$GITHUB_ENV"

    - name: Identify Python version
      shell: bash
      run: |
        if [[ -z "$PYTHON_VERSION" ]]; then
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info[0]}.{ sys.version_info[1]}")')"
          echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"
        fi

    # PyTorch build process expects Intel oneAPI in /opt/intel/oneapi
    - name: Set up oneAPI
      shell: bash
      run: |
        if [[ -d /opt/intel/oneapi ]]; then
          exit 0
        fi
        if [[ -L /opt/intel/oneapi ]]; then
          exit 0
        fi
        sudo mkdir -p /opt/intel
        sudo ln -sfT ${{ inputs.oneapi }} /opt/intel/oneapi

    - name: Generate PyTorch cache key
      id: generate-pytorch-cache-key
      shell: bash
      env:
        # Increase this value to reset cache, also after changing the Build PyTorch step
        CACHE_NUMBER: 20
      run: |
        ONEAPI_LINK=$(readlink /opt/intel/oneapi || true)
        ONEAPI_KEY=$(sha256sum /opt/intel/installed.txt 2> /dev/null | cut -d\  -f1 || true)
        PYTORCH_CACHE_KEY=$(echo $PYTHON_VERSION $PYTORCH_COMMIT_ID ${{ hashFiles('scripts/patch-pytorch.sh', 'scripts/patch/**') }} ${{ inputs.mode }}${ONEAPI_KEY}${ONEAPI_LINK} ${{ inputs.lts }} | sha256sum - | cut -d\  -f1)
        echo "PYTORCH_CACHE_KEY=$PYTORCH_CACHE_KEY" | tee -a "$GITHUB_ENV"
        echo "pytorch_cache_key=pytorch-$PYTORCH_CACHE_KEY-$CACHE_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Load PyTorch from a cache
      id: pytorch-cache
      uses: ./.github/actions/load
      with:
        path: pytorch
        key: ${{ steps.generate-pytorch-cache-key.outputs.pytorch_cache_key }}
        enabled: ${{ inputs.cache != 'disabled' }}

    - name: Download PyTorch wheel
      if: ${{ steps.pytorch-cache.outputs.status == 'miss' && inputs.mode == 'source' && inputs.download_artifact != '' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.download_artifact }}
        path: ${{ runner.temp }}/pytorch-wheel

    # Looks for a prebuilt wheel to install instead of building PyTorch: first the wheel built earlier in this run,
    # then the wheel built on main. Sets found=true, dir and from (run or main) when it finds one.
    # A wheel from main is used only when its cache key equals this runner's. Without a wheel, PyTorch is built.
    - name: Find PyTorch wheel
      id: find-wheel
      if: ${{ steps.pytorch-cache.outputs.status == 'miss' && inputs.mode == 'source' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        LOCAL_KEY="${{ steps.generate-pytorch-cache-key.outputs.pytorch_cache_key }}"
        build_from_source() { echo "::notice::$1, building from source"; exit 0; }
        use_wheel() { printf 'dir=%s\nfrom=%s\nfound=true\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

        # 1. The wheel built earlier in this run (download_artifact)
        if [[ -n "${{ inputs.download_artifact }}" ]]; then
          WHEEL_DIR="$RUNNER_TEMP/pytorch-wheel"
          PRODUCER_KEY="$(<"$WHEEL_DIR/pytorch-cache-key.txt")"
          if [[ "$PRODUCER_KEY" != "$LOCAL_KEY" ]]; then
            echo "::warning::PyTorch wheel was built with key $PRODUCER_KEY, this runner computes $LOCAL_KEY (different oneAPI or a moved ref)"
          fi
          # A branch ref may have moved since the wheel was built, clone the commit the wheel was built from
          echo "PYTORCH_COMMIT_ID=$(<"$WHEEL_DIR/pytorch-commit.txt")" | tee -a "$GITHUB_ENV"
          echo "pytorch_cache_key=$PRODUCER_KEY" >> "$GITHUB_OUTPUT"
          use_wheel "$WHEEL_DIR" run
          exit 0
        fi

        # 2. The wheel from the latest wheels-pytorch-linux.yml run on main, which builds only the default pin
        [[ -z "${{ inputs.ref }}" && "${{ inputs.repository }}" == "pytorch/pytorch" ]] || exit 0
        # A separate venv keeps triton-utils dependencies out of the job's environment
        VENV="$RUNNER_TEMP/triton-utils-venv"
        python -m venv "$VENV" && "$VENV/bin/pip" install "$GITHUB_WORKSPACE/scripts/triton_utils" ||
          build_from_source "Could not install triton-utils"
        "$VENV/bin/triton-utils" wheels \
          --latest-wf-run-pattern .github/workflows/wheels-pytorch-linux.yml \
          --wheel-set torch \
          --python-version "$PYTHON_VERSION" \
          -D "$RUNNER_TEMP/pytorch-main-wheel" \
          -R "$GITHUB_REPOSITORY" ||
          build_from_source "PyTorch wheel lookup on main failed"
        WHEEL_DIR="$RUNNER_TEMP/pytorch-main-wheel/pytorch-py$PYTHON_VERSION"
        [[ -f "$WHEEL_DIR/pytorch-cache-key.txt" ]] ||
          build_from_source "No PyTorch wheel for Python $PYTHON_VERSION on main"
        MAIN_KEY="$(<"$WHEEL_DIR/pytorch-cache-key.txt")"
        [[ "$MAIN_KEY" == "$LOCAL_KEY" ]] ||
          build_from_source "PyTorch wheel on main has key $MAIN_KEY, this runner computes $LOCAL_KEY"
        use_wheel "$WHEEL_DIR" main

    - name: Clone PyTorch repository
      if: ${{ steps.pytorch-cache.outputs.status == 'miss' }}
      uses: actions/checkout@v5
      with:
        repository: ${{ env.PYTORCH_REPO }}
        ref: ${{ env.PYTORCH_COMMIT_ID }}
        # Building PyTorch from source needs all submodules, benchmarks and a prebuilt wheel do not
        submodules: ${{ inputs.mode == 'source' && steps.find-wheel.outputs.found != 'true' && 'recursive' || 'false' }}
        path: pytorch

    - name: Apply additional PR patches
      if: ${{ steps.pytorch-cache.outputs.status == 'miss' && inputs.repository == 'pytorch/pytorch' && inputs.mode == 'source' }}
      shell: bash
      run: |
        cd pytorch
        ../scripts/patch-pytorch.sh

    - name: Build PyTorch
      if: ${{ steps.pytorch-cache.outputs.status == 'miss' && inputs.mode == 'source' && steps.find-wheel.outputs.found != 'true' }}
      shell: bash
      run: |
        source ${{ inputs.oneapi }}/setvars.sh

        # Limit AOT; LTS drivers only support pvc
        if [[ "${{ inputs.lts }}" == "true" ]]; then
          export TORCH_XPU_ARCH_LIST="pvc"
        else
          export TORCH_XPU_ARCH_LIST="pvc,bmg,dg2,arl-h,mtl-h"
        fi

        cd pytorch
        # FIXME: Compatibility with versions of CMake older than 3.5 has been removed, this brakes compilation of third_party/protobuf:
        # CMake Error at third_party/protobuf/cmake/CMakeLists.txt:2 (cmake_minimum_required)
        pip install 'cmake<4.0.0'
        # Try to avoid the following error:
        #   A module that was compiled using NumPy 1.x cannot be run in
        #   NumPy 2.2.6 as it may crash. To support both 1.x and 2.x
        #   versions of NumPy, modules must be compiled with NumPy 2.0.
        #   Some module may need to rebuild instead e.g. with 'pybind11>=2.12'.
        pip install 'numpy>2.0'
        pip install -r requirements.txt
        USE_XCCL=1 USE_STATIC_MKL=1 python -m build --wheel --no-isolation 2>&1 | grep -v \
          "Double arithmetic operation is not supported on this platform with FP64 conversion emulation mode (poison FP64 kernels is enabled)." | grep -v '^$'

    - name: Use PyTorch wheel
      if: ${{ steps.find-wheel.outputs.found == 'true' }}
      shell: bash
      run: |
        mkdir -p pytorch/dist
        cp "${{ steps.find-wheel.outputs.dir }}"/*.whl pytorch/dist/
        if [[ "${{ steps.find-wheel.outputs.from }}" == "main" ]]; then
          echo "::notice::Installing the PyTorch wheel from the latest wheels-pytorch-linux.yml run on main"
        fi

    - name: Install PyTorch (built from source)
      if: ${{ inputs.mode == 'source' }}
      shell: bash
      run: |
        source ${{ inputs.oneapi }}/setvars.sh
        pip install pytorch/dist/*.whl

    - name: Install PyTorch (from wheels)
      if: ${{ inputs.mode == 'wheels' }}
      shell: bash
      run: |
        source ${{ inputs.oneapi }}/setvars.sh
        pip install torch --index-url https://download.pytorch.org/whl/nightly/xpu

    - name: Get PyTorch version
      shell: bash
      run: |
        source ${{ inputs.oneapi }}/setvars.sh
        PYTORCH_VERSION="$(python -c 'import torch;print(torch.__version__)')"
        echo "PYTORCH_VERSION=$PYTORCH_VERSION" | tee -a "$GITHUB_ENV"

    - name: Prepare PyTorch wheel artifact
      if: ${{ inputs.mode == 'source' && inputs.upload_artifact != '' }}
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/pytorch-wheel-upload"
        cp pytorch/dist/*.whl "$RUNNER_TEMP/pytorch-wheel-upload/"
        echo "${{ steps.generate-pytorch-cache-key.outputs.pytorch_cache_key }}" > "$RUNNER_TEMP/pytorch-wheel-upload/pytorch-cache-key.txt"
        echo "$PYTORCH_COMMIT_ID" > "$RUNNER_TEMP/pytorch-wheel-upload/pytorch-commit.txt"

    - name: Upload PyTorch wheel artifact
      if: ${{ inputs.mode == 'source' && inputs.upload_artifact != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.upload_artifact }}
        path: ${{ runner.temp }}/pytorch-wheel-upload
        if-no-files-found: error
        # A wheel is already compressed
        compression-level: 0

    # A wheel from this run may have been built with another key, so it is not cached.
    # A wheel from main has this runner's key, so it is cached like a build.
    - name: Save PyTorch to a cache
      if: ${{ steps.pytorch-cache.outputs.status == 'miss' && steps.find-wheel.outputs.from != 'run' }}
      uses: ./.github/actions/save
      with:
        path: ${{ steps.pytorch-cache.outputs.path }}
        dest: ${{ steps.pytorch-cache.outputs.dest }}
        enabled: ${{ inputs.cache == 'enabled' }}
