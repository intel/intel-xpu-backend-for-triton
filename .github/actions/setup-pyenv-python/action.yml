name: setup-pyenv-python
description: Setup Python via pyenv
inputs:
  python-version:
    description: Python version to setup
  pyenv-version:
    description: Pyenv version to setup
    default: "v2.4.19"
runs:
  using: "composite"
  steps:
    - name: Clone pyenv
      uses: actions/checkout@v5
      with:
        repository: "pyenv/pyenv"
        ref: ${{ inputs.pyenv-version }}
        path: pyenv

    - name: Setup environment variables
      shell: bash
      run: |
        echo PATH="${PWD}/pyenv/bin:${PATH}" >> "${GITHUB_ENV}"
        echo PYENV_ROOT="${PWD}/pyenv" >> "${GITHUB_ENV}"

    - name: Setup pyenv into profile
      shell: bash
      run: |
        eval "$(pyenv init -)" >> ~/.profile

    - name: Install required packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libncurses5-dev libbz2-dev libreadline-dev libsqlite3-dev libssl-dev zlib1g-dev liblzma-dev

    - name: Setup Python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -x
        workers=$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)
        workers=$((workers < 8 ? workers : 8))
        quota=max
        if [[ -r /sys/fs/cgroup/cpu.max ]]; then
          read -r quota period < /sys/fs/cgroup/cpu.max
        elif [[ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us && -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]]; then
          quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
          period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
        fi
        if [[ "$quota" != max && "$quota" -gt 0 ]]; then
          quota_workers=$((quota / period))
          quota_workers=$((quota_workers > 0 ? quota_workers : 1))
          workers=$((workers < quota_workers ? workers : quota_workers))
        fi
        export PYTHON_MAKE_OPTS="${PYTHON_MAKE_OPTS:+${PYTHON_MAKE_OPTS} }-j${workers}"
        export PYTHON_MAKE_INSTALL_OPTS="${PYTHON_MAKE_INSTALL_OPTS:+${PYTHON_MAKE_INSTALL_OPTS} }COMPILEALL_OPTS=-j${workers}"
        case "$PYTHON_VERSION" in
          3.10|3.10.*|3.11|3.11.*)
            # These releases hardcode compileall -j0; backport the install-only Makefile option.
            pyenv install --patch "$PYTHON_VERSION" < "${GITHUB_ACTION_PATH}/compileall-workers.patch"
            ;;
          *)
            pyenv install "$PYTHON_VERSION"
            ;;
        esac
        pyenv global "${PYTHON_VERSION}"
        echo PATH="$(dirname "$(pyenv which "python${PYTHON_VERSION}")"):$PATH" >> "${GITHUB_ENV}"

    - name: Update pip
      shell: bash
      run: |
        set -x
        pip install --upgrade pip

    - name: Use python as python3
      shell: bash
      run: |
        set -x
        mkdir -p ~/.local/bin
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        ls -l ~/.local/bin/
        ln -sf $(which pip${{ inputs.python-version }}) ~/.local/bin/pip
        ln -sf $(which python${{ inputs.python-version }}) ~/.local/bin/python
        ln -sf $(which pip${{ inputs.python-version }}) ~/.local/bin/pip3
        ln -sf $(which python${{ inputs.python-version }}) ~/.local/bin/python3
