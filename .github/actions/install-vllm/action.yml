name: Install vllm
description: Install vLLM and vLLM XPU kernels

inputs:
  use-branch-wheel:
    description: Use prebuilt vLLM XPU kernels wheel from the current branch (must have a successful nightly build)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run install-vllm.sh
      shell: bash --noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
      env:
        # Cap the number of parallel build jobs when compiling vLLM XPU kernels
        # from source. The default (one job per core) OOM-kills memory-constrained
        # runners such as BMG (b580) while building the generated SYCL kernel
        # sources. Lower this further if OOMs persist.
        MAX_JOBS: "4"
      run: |
        # Always build vLLM and vLLM XPU kernels from source, bypassing the
        # nightly-/branch-wheel selection logic. On this branch no nightly wheel
        # matches the pinned vllm-xpu-kernels commit, so wheel install fails.
        ./scripts/vllm/install-vllm.sh --source
