name: Install vllm
description: Install vLLM

inputs:
  kernels-hash:
    description: vLLM XPU kernels commit hash to build from source, keep empty to install vLLM's pinned release
    required: false
    default: ""
  omni:
    description: Install vLLM at the release targeted by the pinned vllm-omni, then vllm-omni
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run install-vllm.sh
      shell: bash --noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
      run: |
        install_args=()
        if [[ -n "${{ inputs.kernels-hash }}" ]]; then
          install_args+=(--kernels-hash "${{ inputs.kernels-hash }}")
        fi
        if [[ "${{ inputs.omni }}" == true ]]; then
          install_args+=(--omni)
        fi
        ./scripts/vllm/install-vllm.sh "${install_args[@]}"
