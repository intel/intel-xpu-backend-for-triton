name: Issue 8258 TD GEMM policy opportunity
run-name: Issue 8258 baseline, forced and learned TD GEMMs - B580

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-8258-td-oracle-b580
  cancel-in-progress: false

jobs:
  gemm:
    runs-on: [linux, b580]
    timeout-minutes: 480
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    env:
      PYTHONUNBUFFERED: '1'
      TRITON_BACKENDS_IN_TREE: '1'
      TRITON_XPU_GEN_NATIVE_CODE: '0'
      MAX_JOBS: '8'
      DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Set report directory
        timeout-minutes: 1
        run: |
          echo "GEMM_CI_REPORTS=$RUNNER_TEMP/issue-8258-oracle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Verify compiler revision and exact scope
        timeout-minutes: 3
        run: |
          git diff --exit-code 64da192bf49730aee02f444591623bd8b5ccb4ee -- third_party/intel python/triton include lib setup.py cmake
          python3 scripts/issue_8258_oracle/preflight.py
          python3 scripts/issue_8258_oracle/driver.py describe
      - uses: ./.github/actions/setup-pyenv-python
        timeout-minutes: 10
        with:
          python-version: '3.12'
      - name: Install focused build and test dependencies
        timeout-minutes: 5
        run: pip install cmake ninja cloudpickle pytest lit numpy
      - uses: ./.github/actions/setup-pytorch
        timeout-minutes: 30
      - name: Build the experimental compiler once
        timeout-minutes: 150
        uses: ./.github/actions/setup-triton
        with:
          command: DEBUG=0 pip install -e . --no-build-isolation -v
      - name: Rebuild and run related compiler checks
        timeout-minutes: 30
        run: |
          make
          mkdir -p "$GEMM_CI_REPORTS"
          BUILD_DIR=$(PYTHONPATH=./python python -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')
          ninja -C "$BUILD_DIR" triton-opt
          (cd "$BUILD_DIR" && lit -v test/TritonIntelGPU/accelerate-matmul-edge-cases.mlir) 2>&1 | tee "$GEMM_CI_REPORTS/lit.log"
          ZE_AFFINITY_MASK=-1 TRITON_INTEL_DEVICE_ARCH=bmg python -c 'import torch; torch.xpu.is_available=lambda:False; torch.xpu.device_count=lambda:0; import pytest; raise SystemExit(pytest.main(["-s", "--tb=short", "python/test/unit/test_stages_inspection.py", "-k", "gemm_policy or one_stage_dot_loop_hint"]))' 2>&1 | tee "$GEMM_CI_REPORTS/compiler-tests.log"
      - name: Capture unused GPU and exact software environment
        timeout-minutes: 12
        run: |
          python scripts/issue_8258_oracle/driver.py capture
          pip freeze > "$GEMM_CI_REPORTS/packages.txt"
          dpkg-query -W > "$GEMM_CI_REPORTS/system-packages.txt"
          cp -r scripts/issue_8258_oracle "$GEMM_CI_REPORTS/harness"
      - name: Compile, independently retune and confirm only the scoped TD GEMMs
        timeout-minutes: 205
        run: |
          timeout --signal=TERM --kill-after=30s 200m python scripts/issue_8258_oracle/driver.py run
      - name: Summarize completed and partial measurements
        timeout-minutes: 5
        if: always()
        run: |
          if [[ -d "$GEMM_CI_REPORTS/cases" ]]; then python scripts/issue_8258_oracle/driver.py summarize; fi
          if [[ -f "$GEMM_CI_REPORTS/SUMMARY.md" ]]; then cat "$GEMM_CI_REPORTS/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence including partial failures
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-8258-td-oracle-b580-${{ github.run_id }}
          compression-level: 6
          path: |
            ${{ env.GEMM_CI_REPORTS }}/**
            !${{ env.GEMM_CI_REPORTS }}/**/cache/**
            !${{ env.GEMM_CI_REPORTS }}/**/launcher-cache/**
