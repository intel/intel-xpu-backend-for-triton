name: Issue 8258 focused device comparison
run-name: Issue 8258 - three original GEMM shapes on ${{ inputs.device }}

on:
  workflow_dispatch:
    inputs:
      device:
        description: GPU for the three-shape stock Triton versus SYCL-TLA comparison
        required: true
        type: choice
        options: [b60, max1550]

permissions:
  contents: read
  actions: read

jobs:
  gemm:
    runs-on: [linux, '${{ inputs.device }}']
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    env:
      VERIFY: '1'
      BENCHMARKING_METHOD: UPSTREAM_PYTORCH_PROFILER
      TORCHINDUCTOR_USE_EXPERIMENTAL_BENCHMARKER: '0'
      TRITON_XPU_GEN_NATIVE_CODE: '0'
      PTI_COLLECTION_MODE: ${{ inputs.device == 'max1550' && '0' || '' }}
      TRITON_PRINT_AUTOTUNING: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install cmake cloudpickle
      - uses: ./.github/actions/setup-pytorch
      - uses: ./.github/actions/setup-triton
      - name: Download the benchmark wheel used for the B580 comparison
        uses: actions/download-artifact@v7
        with:
          run-id: 40643335150
          name: benchmarks-wheel-py3.12
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gemm-8258-wheel
      - name: Install the pinned benchmark wheel
        run: |
          pip install "$GITHUB_WORKSPACE/scripts/triton_utils"
          pip uninstall -y triton-kernels-benchmark 2>/dev/null || true
          cd "$RUNNER_TEMP/gemm-8258-wheel"
          pip install *.whl
      - name: Record software and hardware
        run: |
          mkdir -p reports
          source ./scripts/capture-hw-details.sh
          git rev-parse HEAD > reports/commit.txt
          pip freeze > reports/packages.txt
          dpkg-query -W > reports/system-packages.txt
          sha256sum "$RUNNER_TEMP/gemm-8258-wheel/"*.whl > reports/benchmark-wheel.sha256
      - name: Run only the three original issue GEMMs
        env:
          TRITON_CACHE_DIR: ${{ runner.temp }}/gemm-8258-${{ github.run_id }}
          TARGET_DEVICE: ${{ inputs.device }}
        run: |
          python scripts/issue_8258_devices/run.py --device "$TARGET_DEVICE" --describe
          python scripts/issue_8258_devices/run.py --device "$TARGET_DEVICE" --reports reports 2>&1 | tee reports/driver.log
      - name: Upload GEMM evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gemm-8258-${{ inputs.device }}-${{ github.run_id }}
          path: reports/
