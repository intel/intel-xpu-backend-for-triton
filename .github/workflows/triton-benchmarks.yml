name: Issue 8258 compiler V4 comparison
run-name: Issue 8258 compiler V4 - B580 matched baseline comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-8258-compiler-v4-b580
  cancel-in-progress: false

jobs:
  gemm:
    runs-on: [linux, b580]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    env:
      TRITON_BACKENDS_IN_TREE: '1'
      TRITON_XPU_GEN_NATIVE_CODE: '0'
      PYTHONUNBUFFERED: '1'
      DEBUG: '0'
      MAX_JOBS: '8'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set report directory
        run: echo "GEMM_CI_REPORTS=$RUNNER_TEMP/issue-8258-compiler-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Verify compiler base and scope
        run: |
          git diff --exit-code d08bc5046315e7f3fef985eaae4c63ee1d48a6dd -- third_party/intel python/triton include lib setup.py cmake
          python3 scripts/issue_8258_compiler/run.py describe
          git apply --check --whitespace=error scripts/issue_8258_compiler/candidate.patch
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build and focused test dependencies
        run: pip install cmake ninja cloudpickle pytest lit numpy
      - uses: ./.github/actions/setup-pytorch
      - name: Build baseline compiler
        uses: ./.github/actions/setup-triton
        with:
          command: DEBUG=0 pip install -e . --no-build-isolation -v
      - name: Rebuild and save baseline runtime
        run: |
          make
          python scripts/issue_8258_compiler/run.py snapshot --policy baseline
      - name: Apply candidate and rebuild using the same configuration
        run: |
          git apply --whitespace=error scripts/issue_8258_compiler/candidate.patch
          make
          python scripts/issue_8258_compiler/run.py snapshot --policy candidate
          git diff -- third_party/intel python/test/unit/test_stages_inspection.py test/TritonIntelGPU/accelerate-matmul-edge-cases.mlir > "$GEMM_CI_REPORTS/applied.diff"
      - name: Capture unused B580 and toolchain details
        run: |
          PYTHONPATH="$GEMM_CI_REPORTS/runtimes/baseline" python scripts/issue_8258_compiler/run.py capture
          pip freeze > "$GEMM_CI_REPORTS/packages.txt"
          dpkg-query -W > "$GEMM_CI_REPORTS/system-packages.txt"
          cp scripts/issue_8258_compiler/scope.json "$GEMM_CI_REPORTS/scope.json"
          cp scripts/issue_8258_compiler/candidate.patch "$GEMM_CI_REPORTS/candidate.patch"
      - name: Run only related compiler regression checks
        run: |
          BUILD_DIR=$(PYTHONPATH=./python python -c 'from build_helpers import get_cmake_dir; print(get_cmake_dir())')
          ninja -C "$BUILD_DIR" triton-opt
          (
            cd "$BUILD_DIR"
            lit -v test/TritonIntelGPU/accelerate-matmul-edge-cases.mlir test/TritonIntelGPU/accelerate-matmul-ats.mlir test/TritonIntelGPU/accelerate-matmul-pvc.mlir test/TritonIntelGPU/accelerate-matmul-int8.mlir test/TritonIntelGPU/accelerate-matmul-fp8.mlir test/TritonIntelGPU/accelerate-matmul-alt-accum.mlir test/TritonIntelGPU/descriptor_load_store_to_llvm.mlir test/Conversion/intel/dpas_to_block_layout_convert.mlir
          ) 2>&1 | tee "$GEMM_CI_REPORTS/lit.log"
          ZE_AFFINITY_MASK=-1 TRITON_INTEL_DEVICE_ARCH=bmg python -c 'import torch; torch.xpu.is_available=lambda:False; torch.xpu.device_count=lambda:0; import pytest; raise SystemExit(pytest.main(["-s", "--tb=short", "python/test/unit/test_stages_inspection.py::test_intel_one_stage_dot_loop_hint"]))' 2>&1 | tee "$GEMM_CI_REPORTS/pytest.log"
      - name: Compile and measure only the scoped GEMMs
        run: |
          for GROUP in slow ci ci-bt; do
            COMPILE_GROUP=all
            EXTRA=()
            if [[ "$GROUP" == slow ]]; then COMPILE_GROUP=slow; fi
            if [[ "$GROUP" == ci-bt ]]; then EXTRA+=(--transpose-b); fi
            for POLICY in baseline candidate; do
              KERNEL_SOURCE=()
              if [[ "$POLICY" == candidate ]]; then KERNEL_SOURCE+=(--kernel-source-file "$GEMM_CI_REPORTS/$GROUP/kernel.py"); fi
              PYTHONPATH="$GEMM_CI_REPORTS/runtimes/$POLICY" python scripts/issue_8258_compiler/compile.py --compiler "$POLICY" --group "$COMPILE_GROUP" --output-tag "$GROUP" "${EXTRA[@]}" "${KERNEL_SOURCE[@]}" 2>&1 | tee "$GEMM_CI_REPORTS/compile-$GROUP-$POLICY.log"
            done
            python scripts/issue_8258_compiler/run.py prepare --group "$GROUP"
            PYTHONPATH="$GEMM_CI_REPORTS/runtimes/baseline" TRITON_CACHE_DIR="$GEMM_CI_REPORTS/launcher-cache" python scripts/issue_8258_compiler/run.py measure --group "$GROUP" 2>&1 | tee "$GEMM_CI_REPORTS/timing-$GROUP.log"
          done
      - name: Summarize and flag performance regressions
        run: python scripts/issue_8258_compiler/run.py summarize
      - name: Publish job summary when available
        if: always()
        run: |
          if [[ -f "$GEMM_CI_REPORTS/SUMMARY.md" ]]; then cat "$GEMM_CI_REPORTS/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-8258-compiler-v4-b580-${{ github.run_id }}
          compression-level: 6
          path: |
            ${{ env.GEMM_CI_REPORTS }}/**
            !${{ env.GEMM_CI_REPORTS }}/runtimes/**
            !${{ env.GEMM_CI_REPORTS }}/**/compiler-cache/**
            !${{ env.GEMM_CI_REPORTS }}/launcher-cache/**
