name: Issue 8258 no-A-prefetch sweep
run-name: Issue 8258 - baseline versus no A prefetch - B580

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gemm:
    runs-on: [linux, b580]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    env:
      VERIFY: '1'
      BENCHMARKING_METHOD: UPSTREAM_PYTORCH_PROFILER
      TORCHINDUCTOR_USE_EXPERIMENTAL_BENCHMARKER: '0'
      TRITON_PRINT_AUTOTUNING: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      TRITON_XPU_GEN_NATIVE_CODE: '0'
      TRITON_INTEL_ENABLE_IGC_SHADER_DUMP: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install cmake cloudpickle
      - uses: ./.github/actions/setup-pytorch
      - uses: ./.github/actions/setup-triton
      - uses: ./.github/actions/install-benchmarks
        with:
          python-version: '3.12'
          github-token: ${{ github.token }}
      - name: CPU scope and transformation checks
        run: |
          python scripts/issue_8258_no_a/check.py
          python scripts/issue_8258_no_a/run.py --describe
      - name: Record software and hardware
        run: |
          mkdir -p reports
          source ./scripts/capture-hw-details.sh
          git rev-parse HEAD > reports/commit.txt
          pip freeze > reports/packages.txt
          dpkg-query -W > reports/system-packages.txt
          ocloc --version > reports/ocloc.txt 2>&1
      - name: Run only baseline versus no-A-prefetch manifest
        env:
          TRITON_CACHE_DIR: ${{ runner.temp }}/gemm-8258-no-a-${{ github.run_id }}
        run: python scripts/issue_8258_no_a/run.py --reports reports
      - name: Upload complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gemm-8258-no-a-${{ github.run_id }}
          path: reports/
