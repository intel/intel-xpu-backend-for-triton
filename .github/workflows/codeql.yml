name: "CodeQL Advanced"

on:
  workflow_dispatch:
  schedule:
    - cron: '5 2 * * *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: rss-ubuntu-2404
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: manual
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # rss-ubuntu-2404 has no C compiler preinstalled; pyenv needs one (plus libffi
    # for the _ctypes module) to build Python from source.
    - name: Install build toolchain
      if: matrix.build-mode == 'manual'
      uses: ./.github/actions/install-build-toolchain

    # Initialize FIRST so the build tracer is installed before the C/C++ compile.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # queries: security-extended,security-and-quality
        config: |
          paths-ignore:
            - '**/third_party/nvidia/**'
            - '**/third_party/amd/**'
            - '**/third_party/proton/**'
            - '**/SPIRVToLLVMTranslator/**'
            - '**/lib/Dialect/Triton/**'
            - '**/lib/Dialect/TritonGPU/**'
            - '**/lib/Dialect/TritonNvidiaGPU/**'
            - '**/lib/Dialect/NVGPU/**'
            - '**/lib/Analysis/**'
            - '**/lib/Conversion/TritonGPUToLLVM/**'
            - '**/lib/Conversion/TritonToTritonGPU/**'
            - '**/include/triton/Dialect/**'
            - '**/include/triton/Tools/**'
            - '**/include/triton/Analysis/**'
            - '**/include/triton/Conversion/TritonGPUToLLVM/**'
            - '**/unittest/**'
            - '**/test/lib/**'
            - '**/include/pybind11/**'
            - '**/googletest/**'
            - '**/json/include/nlohmann/**'
            - '**/cmake/**/Modules/**'
            - '**/build/**'
            - '**/cache/**'

    # Traced build: runs AFTER init, BEFORE analyze, only on the manual (c-cpp) leg.
    - name: Setup Python
      if: matrix.build-mode == 'manual'
      uses: ./.github/actions/setup-python
      with:
        python_version: "3.10"
        use_pyenv: true

    - name: Set MAX_JOBS
      if: matrix.build-mode == 'manual'
      run: echo "MAX_JOBS=${MAX_JOBS:-2}" >> "$GITHUB_ENV"

    - name: Build Triton (traced)
      if: matrix.build-mode == 'manual'
      uses: ./.github/actions/setup-triton
      with:
        command: pip install -e .

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        output: results

    - name: Upload SARIF results
      uses: actions/upload-artifact@v7
      with:
        name: sarif-results-${{ matrix.language }}
        path: results

  report:
    name: Generate SDL Security Report
    needs: analyze
    runs-on: rss-ubuntu-2404
    permissions:
      security-events: read
      contents: read
    steps:
    - name: Download SARIF results
      uses: actions/download-artifact@v8
      with:
        pattern: sarif-results-*
        path: results
        merge-multiple: true

    # The report action renders the PDF with puppeteer-core using channel: 'chrome',
    # which requires a system Chrome at the hardcoded /opt/google/chrome/chrome.
    - name: Install Chrome for PDF generation
      run: |
        if [[ -x /opt/google/chrome/chrome ]]; then
          echo "Chrome already present: $(/opt/google/chrome/chrome --version)"
          exit 0
        fi
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/chrome.deb" \
          https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          "$tmp/chrome.deb"
        /opt/google/chrome/chrome --version

    - name: Generate Security Report
      uses: rsdmike/github-security-report-action@1df22b1e0a7e15b32f728ccf7bab259e46c80589 # v4.0.1
      with:
        template: report
        token: ${{ secrets.SECURITY_TOKEN }}
        sarifReportDir: results

    # The report action swallows PDF-generation errors and exits 0, so check explicitly.
    - name: Verify report was generated
      run: test -s ./report.pdf

    - name: GitHub Upload Release Artifacts
      uses: actions/upload-artifact@v7   # v2 is retired on github.com — must be v4+
      with:
        name: report
        path: |
          ./report.pdf
        if-no-files-found: error
