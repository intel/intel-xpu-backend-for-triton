name: vLLM benchmarks, BMG

permissions: read-all

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 8 * * *"

# Give unrelated-label skip runs a separate lane so they cannot cancel a real run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'ci' }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-vllm-benchmarks' && 'skip' || 'run' }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for vLLM benchmark changes
        id: check
        uses: ./.github/actions/check-path-changes
        with:
          patterns: '^(\.github/workflows/(vllm-benchmarks|build-benchmarks-wheel).*\.yml|\.github/actions/(install-benchmarks|install-vllm)/|benchmarks/triton_kernels_benchmark/vllm/|scripts/vllm/|\.github/pins/pytorch\.txt)'

  build-wheel:
    needs: check-paths
    if: >-
      github.event_name == 'schedule' ||
      needs.check-paths.outputs.benchmarks == 'true' ||
      github.event.label.name == 'run-vllm-benchmarks'
    uses: ./.github/workflows/build-benchmarks-wheel.yml
    with:
      python-version: "3.12"

  benchmarks:
    needs: [check-paths, build-wheel]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       needs.check-paths.outputs.benchmarks == 'true' ||
       github.event.label.name == 'run-vllm-benchmarks')
    uses: ./.github/workflows/vllm-benchmarks.yml
    with:
      runner_label: b580
    secrets: inherit
