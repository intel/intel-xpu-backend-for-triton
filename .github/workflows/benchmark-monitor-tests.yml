name: Benchmark monitor tests

on:
  pull_request:
    paths:
      - benchmarks/benchmark_monitor/**
      - .github/workflows/benchmark-monitor-tests.yml
  push:
    branches: [main]
    paths:
      - benchmarks/benchmark_monitor/**
      - .github/workflows/benchmark-monitor-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: benchmarks/benchmark_monitor/pyproject.toml
      - name: Install
        run: python -m pip install ./benchmarks/benchmark_monitor pytest jsonschema
      - name: Test
        run: python -m pytest benchmarks/benchmark_monitor/tests -q
