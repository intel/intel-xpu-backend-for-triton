name: vLLM tests reusable workflow

on:
  workflow_call:
    inputs:
      runner_label:
        description: Runner label, keep empty for default
        type: string
        default: ""
      vllm_pin:
        description: vLLM pin (commit hash), keep empty for default
        type: string
        default: ""
      kernels_hash:
        description: vLLM XPU kernels commit hash to build from source, keep empty to install vLLM's pinned release
        type: string
        default: ""
      skip_list:
        description: Skip list directory override
        type: string
        default: ""
      python_version:
        description: Python version
        type: string
        default: "3.12"
      ignore_errors:
        description: Ignore test errors
        type: boolean
        default: false
      use_pyenv_python:
        description: Use Python built with pyenv
        type: boolean
        default: false

permissions: read-all

env:
  PYTHON_VERSION: ${{ inputs.python_version }}
  # Increase this value to reset cache
  PIP_CACHE_NUMBER: 1
  HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  setup:
    name: Setup
    runs-on: ${{ fromJSON((inputs.runner_label == '' || startsWith(inputs.runner_label, 'max')) && format('["linux", "rolling", "{0}"]', inputs.runner_label || 'max1100') || format('["linux", "{0}"]', inputs.runner_label)) }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    outputs:
      test-triton-command: ${{ steps.test-triton.outputs.command }}
    steps:
      - name: Print inputs
        run: |
          cat <<EOF
          ${{ toJSON(inputs) }}
          EOF

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load pip cache
        id: pip-cache
        uses: ./.github/actions/load
        with:
          path: $HOME/.cache/pip
          key: pip-${{ inputs.python_version }}-${{ hashFiles('pyproject.toml', 'setup.py') }}-${{ env.PIP_CACHE_NUMBER }}

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}
          use_pyenv: ${{ inputs.use_pyenv_python }}

      - name: Identify Python version
        run: |
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info[0]}.{ sys.version_info[1]}")')"
          echo "PYTHON_VERSION=$PYTHON_VERSION" | tee -a $GITHUB_ENV

      - name: Install Python build dependencies
        run: |
          pip install cmake
          pip install -r python/requirements.txt

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          lts: ${{ inputs.runner_label == 'lts' }}

      - name: Reuse PR #7452 Triton wheel
        uses: actions/download-artifact@v8
        with:
          name: triton-vllm-${{ inputs.python_version }}
          path: dist/
          run-id: 36612984279
          github-token: ${{ github.token }}

      - name: Upload Triton wheel
        uses: actions/upload-artifact@v7
        with:
          name: triton-vllm-${{ inputs.python_version }}
          path: dist/*.whl

      - name: Install Triton from wheel
        run: |
          pip install dist/*.whl

      - name: Set test-triton command line
        id: test-triton
        run: |
          skiplist="$GITHUB_WORKSPACE/scripts/skiplist/default"
          if [[ -n "${{ inputs.skip_list }}" ]]; then
            skiplist="$GITHUB_WORKSPACE/scripts/skiplist/${{ inputs.skip_list }}"
          fi
          TRITON_TEST_CMD="bash -x scripts/test-triton.sh --skip-pip-install --skip-pytorch-install --reports-dir $GITHUB_WORKSPACE/reports --skip-list $skiplist ${{ inputs.ignore_errors && '--ignore-errors' || '' }}"
          echo "command=$TRITON_TEST_CMD" | tee -a $GITHUB_OUTPUT

      - name: Install test dependencies
        run: |
          pip install -r scripts/requirements-test.txt

      - name: Save pip cache
        if: ${{ steps.pip-cache.outputs.status == 'miss' }}
        uses: ./.github/actions/save
        with:
          path: ${{ steps.pip-cache.outputs.path }}
          dest: ${{ steps.pip-cache.outputs.dest }}

  tests:
    name: ${{ matrix.suite }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        suite:
          - vllm-moe
    runs-on: ${{ fromJSON((inputs.runner_label == '' || startsWith(inputs.runner_label, 'max')) && format('["linux", "rolling", "{0}"]', inputs.runner_label || 'max1100') || format('["linux", "{0}"]', inputs.runner_label)) }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Override vLLM pin
        if: ${{ inputs.vllm_pin }}
        run: |
          echo "${{ inputs.vllm_pin }}" > scripts/vllm/vllm-pin.txt
          echo "Overriding vLLM pin to: ${{ inputs.vllm_pin }}"

      - name: Load pip cache
        id: pip-cache
        uses: ./.github/actions/load
        with:
          path: $HOME/.cache/pip
          key: pip-${{ inputs.python_version }}-${{ matrix.suite }}-${{ hashFiles('pyproject.toml', 'setup.py') }}-${{ env.PIP_CACHE_NUMBER }}

      - name: Download Triton wheel
        uses: actions/download-artifact@v8
        with:
          name: triton-vllm-${{ inputs.python_version }}
          path: dist/

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}
          use_pyenv: ${{ inputs.use_pyenv_python }}

      - name: Identify Python version
        run: |
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info[0]}.{ sys.version_info[1]}")')"
          echo "PYTHON_VERSION=$PYTHON_VERSION" | tee -a $GITHUB_ENV

      - name: Install Python build dependencies
        run: |
          pip install cmake

      - name: Setup PyTorch
        id: setup-pytorch
        uses: ./.github/actions/setup-pytorch
        with:
          lts: ${{ inputs.runner_label == 'lts' }}

      - name: Identify torchvision pin
        if: ${{ matrix.suite == 'vllm-spec-decode' || matrix.suite == 'vllm-mrv2' || matrix.suite == 'vllm-rest' }}
        run: |
          echo "TORCHVISION_COMMIT_ID=$(<pytorch/.github/ci_commit_pins/vision.txt)" | tee -a "$GITHUB_ENV"

      - name: Install torchvision package
        if: ${{ matrix.suite == 'vllm-spec-decode' || matrix.suite == 'vllm-mrv2' || matrix.suite == 'vllm-rest' }}
        uses: ./.github/actions/install-dependency
        with:
          package: torchvision
          repository: pytorch/vision
          ref: ${{ env.TORCHVISION_COMMIT_ID }}
          extra-cache-key: ${{ steps.setup-pytorch.outputs.pytorch_cache_key }}

      - name: Install Triton from wheel
        id: install
        run: |
          pip install dist/*.whl
          python -c 'import triton; print(triton.__version__)'

      - name: Install test dependencies
        run: |
          pip install -r scripts/requirements-test.txt

      - name: Set test-triton command line
        run: |
          echo "TRITON_TEST_CMD=${{ needs.setup.outputs.test-triton-command }}" | tee -a $GITHUB_ENV
          echo "VLLM_PIN=${{ inputs.vllm_pin }}" | tee -a $GITHUB_ENV

      - name: Install vllm
        id: install-vllm
        if: ${{ steps.install.outcome == 'success' && !cancelled() }}
        uses: ./.github/actions/install-vllm
        with:
          kernels-hash: ${{ inputs.kernels_hash }}

      - name: Create reports dir
        run: |
          mkdir -p reports

      - name: Run spec-decode tests
        if: ${{ matrix.suite == 'vllm-spec-decode' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-spec-decode

      - name: Run mrv2 tests
        if: ${{ matrix.suite == 'vllm-mrv2' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-mrv2

      - name: Run moe tests
        if: ${{ matrix.suite == 'vllm-moe' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          pip install accelerate blake3 cachetools cbor2 openai_harmony pybase64 tblib
          cd vllm
          python -u -m pytest -s --tb=short -vvv \
            "tests/kernels/moe/test_moe.py::test_fused_moe[True-True-dtype0-1-6-192-32768-2048-511]" \
            "tests/kernels/moe/test_moe.py::test_fused_moe[True-True-dtype0-1-6-192-40000-1024-1024]" \
            --junitxml=../reports/vllm_moe.xml

      - name: Run triton-attn tests
        if: ${{ matrix.suite == 'vllm-triton-attn' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-triton-attn

      - name: Run mamba tests
        if: ${{ matrix.suite == 'vllm-mamba' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-mamba

      - name: Run quant tests
        if: ${{ matrix.suite == 'vllm-quant' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-quant

      - name: Run kda tests
        if: ${{ matrix.suite == 'vllm-kda' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-kda

      # vllm-rest groups short suites: gdn-attn, linear-attn, deepgemm
      - name: Run gdn-attn tests
        if: ${{ matrix.suite == 'vllm-rest' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-gdn-attn

      - name: Run linear-attn tests
        if: ${{ matrix.suite == 'vllm-rest' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-linear-attn

      - name: Run deepgemm tests
        if: ${{ matrix.suite == 'vllm-rest' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-deepgemm

      - name: Run inductor tests
        if: ${{ matrix.suite == 'vllm-rest' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-inductor

      - name: Run tdesc tests
        if: ${{ matrix.suite == 'vllm-tdesc' && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          ${{ env.TRITON_TEST_CMD }} --vllm-tdesc

      - name: Save pip cache
        if: ${{ steps.pip-cache.outputs.status == 'miss' }}
        uses: ./.github/actions/save
        with:
          path: ${{ steps.pip-cache.outputs.path }}
          dest: ${{ steps.pip-cache.outputs.dest }}

      - name: Upload test report
        if: ${{ steps.install.outcome == 'success' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.suite }}
          path: reports

  reports:
    needs: tests
    if: always()
    uses: ./.github/workflows/reports-reusable.yml
    with:
      artifact_pattern: test-reports-vllm-*
      python_version: ${{ inputs.python_version }}
      runner_label: ${{ inputs.runner_label }}
      use_pyenv_python: ${{ inputs.use_pyenv_python }}
