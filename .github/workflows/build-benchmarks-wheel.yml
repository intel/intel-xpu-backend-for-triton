name: Build benchmarks wheel

# Wheels are signed with keyless Sigstore (OIDC). Each *.whl is accompanied by a
# *.whl.sigstore.json bundle in the benchmarks-wheel-py* artifacts.
#
# Verify a downloaded benchmarks wheel + bundle:
#   cosign verify-blob triton_kernels_benchmark-*.whl \
#     --bundle triton_kernels_benchmark-*.whl.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       'https://github.com/intel/intel-xpu-backend-for-triton/.github/workflows/build-benchmarks-wheel.yml@.*'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        description: Python version to build (builds all versions if empty)
        type: string
        default: ""
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - benchmarks/**
      - .github/workflows/build-benchmarks-wheel.yml
  pull_request:
    branches:
      - main
    paths:
      - benchmarks/**
      - .github/workflows/build-benchmarks-wheel.yml

concurrency:
  group: ${{ github.workflow }}-wheel-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'keep-going') && github.run_id || github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for keyless Sigstore/OIDC signing

jobs:
  build:
    name: Build benchmarks wheel
    runs-on:
      - max1100
      - rolling
      - runner-0.0.22
    strategy:
      matrix:
        python: ${{ fromJson(inputs.python-version && format('["{0}"]', inputs.python-version) || '["3.10","3.11","3.12","3.13","3.14"]') }}
      fail-fast: false
      max-parallel: 2
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install benchmarks build dependencies
        run: |
          pip install -r python/requirements.txt

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch

      - name: Build benchmarks wheel
        run: |
          cd benchmarks
          python -m build --wheel --no-isolation

      - name: Sign wheels with Sigstore (keyless)
        # SHA-pinned for supply-chain safety; comment tracks the human-readable version.
        uses: sigstore/gh-action-sigstore-python@a5caf349bc536fbef3668a10ed7f5cd309a4b53d # v3.2.0
        with:
          inputs: benchmarks/dist/*.whl

      - name: Install benchmarks wheel
        run: |
          # Uninstall first — see install-benchmarks/action.yml for full rationale.
          pip uninstall -y triton-kernels-benchmark 2>/dev/null || true
          cd benchmarks/dist
          pip install *.whl

      - name: Validate benchmarks wheel
        run: |
          triton-benchmarks-validate

      - name: Upload benchmarks wheel
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-wheel-py${{ matrix.python }}
          path: |
            benchmarks/dist/*.whl
            benchmarks/dist/*.whl.sigstore.json
