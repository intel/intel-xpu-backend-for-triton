name: Test TritonKernelRunner

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: read-all

env:
  PYTHON_VERSION: '3.11'

jobs:
  tests:
    name: Tests
    runs-on:
      - rolling
      - runner-0.0.22
    timeout-minutes: 160
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch

      - name: Setup Triton
        uses: ./.github/actions/setup-triton

      - name: Build TritonKernelRunner
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -x
          export LLVM_DIR="$HOME/.triton/llvm/llvm-ubuntu-x64"
          export CMAKE_PREFIX_PATH="$(python scripts/torch_cmake.py)"
          cd utils/TritonKernelRunner
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          make -j

      - name: Test TritonKernelRunner
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -x
          pip install pytest
          export TRITON_KERNEL_RUNNER_PATH="$GITHUB_WORKSPACE/utils/TritonKernelRunner/build/TritonKernelRunner"
          export TRITON_KERNEL_RUNNER_TESTS="$GITHUB_WORKSPACE/utils/TritonKernelRunner/tests"
          cd utils/TritonKernelRunner
          pytest tests/test_triton_kernel_runner.py
