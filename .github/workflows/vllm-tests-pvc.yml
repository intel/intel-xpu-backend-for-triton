name: vLLM tests, PVC

permissions: read-all

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/vllm-tests*.yml
      - .github/actions/install-vllm/**
      - scripts/vllm/**
      - .github/pins/pytorch.txt
      - scripts/patch-pytorch.sh
      - scripts/pytorch-*.patch
  schedule:
    # Daily 9:05PM PST (UTC-8) or 10:05PM PDT (UTC-7)
    - cron: "5 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'ci' }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/vllm-tests-reusable.yml
    with:
      runner_label: max1100
    secrets: inherit
