name: UA offline tuning with cold graph replay
run-name: UA CI-input tuning (${{ github.ref_name }})

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      runner_label:
        description: Intel XPU runner label
        type: string
        required: true
        default: b580
      device:
        description: PyTorch XPU device on the selected runner
        type: string
        default: xpu:0
      part:
        description: Tuning part to run (all runs four parts sequentially)
        type: choice
        default: all
        options: [all, '1', '2', '3', '4']
      create_pr:
        description: Propose config updates after all parts run on the default branch
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ua-ci-offline-tune
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TRITON_CACHE_DIR: ${{ github.workspace }}/.ua-tuning-cache-${{ github.run_id }}
  UA_TUNING_DEVICE: ${{ inputs.device || 'xpu:0' }}

jobs:
  tune:
    name: Tune part ${{ matrix.part }} of 4
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ${{ fromJSON((inputs.part || 'all') == 'all' && '[1,2,3,4]' || format('[{0}]', inputs.part)) }}
    runs-on: ${{ fromJSON(startsWith(inputs.runner_label, 'max') && format('["linux", "rolling", "{0}"]', inputs.runner_label) || format('["linux", "{0}"]', inputs.runner_label || 'b580')) }}
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install cmake
      - uses: ./.github/actions/setup-pytorch
        with:
          lts: ${{ inputs.runner_label == 'lts' }}
      - uses: ./.github/actions/setup-triton
      - uses: ./.github/actions/install-vllm
      - name: Install benchmark import dependencies
        run: pip install 'pandas<3.0' scipy psutil tabulate matplotlib
      - name: Apply offline UA patch
        run: |
          git -C vllm apply --check "$PWD/benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch"
          git -C vllm apply "$PWD/benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch"
      - name: Record environment and inputs
        run: |
          mkdir -p reports/configs
          ./scripts/capture-hw-details.sh > reports/environment.txt
          python -m pip freeze > reports/packages.txt
          git rev-parse HEAD > reports/checkout.txt
          export PYTHONPATH="$PWD/benchmarks:$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/vllm/ua_tuning/shard.py --device "$UA_TUNING_DEVICE" \
            --part ${{ matrix.part }} --output reports/manifests
      - name: Tune BF16 inputs for this part
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/vllm/ua_tuning/tune_ci.py --tune --clear-cache \
            --device "$UA_TUNING_DEVICE" \
            --manifest reports/manifests/bfloat16.json \
            --save-dir reports/configs 2>&1 | tee reports/bf16-tuning.log
      - name: Save BF16 configs and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ua-cold-graph-part-${{ matrix.part }}-bf16
          path: reports
          if-no-files-found: warn
      - name: Tune FP8 inputs for this part
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/vllm/ua_tuning/tune_ci.py --tune --clear-cache \
            --device "$UA_TUNING_DEVICE" \
            --manifest reports/manifests/float8_e4m3fn.json \
            --save-dir reports/configs 2>&1 | tee reports/fp8-tuning.log
      - name: Upload configs and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ua-cold-graph-part-${{ matrix.part }}-profiles
          path: reports
          if-no-files-found: warn

  propose-configs:
    name: Propose updated tuning configs
    needs: tune
    if: >-
      ${{ success() && (github.event_name == 'schedule' ||
          (inputs.create_pr && inputs.part == 'all' && github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      RUNNER_LABEL: ${{ inputs.runner_label || 'b580' }}
      CONFIG_DIR: benchmarks/triton_kernels_benchmark/vllm/unified_attention/configs
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: ua-cold-graph-part-*-profiles
          path: ${{ runner.temp }}/ua-tuning-artifacts
      - name: Collect changed tuning winners
        id: collect
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/vllm/ua_tuning/collect.py \
            --artifacts "$RUNNER_TEMP/ua-tuning-artifacts" --configs "$CONFIG_DIR" \
            --report "$RUNNER_TEMP/ua-tuning-pr.md" --run-url "$RUN_URL" --source-sha "$SOURCE_SHA"
          cat "$RUNNER_TEMP/ua-tuning-pr.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update config PR
        if: steps.collect.outputs.changed == 'true'
        run: |
          runner=$(printf '%s' "$RUNNER_LABEL" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_-' '-')
          branch="bot/ua-offline-tuning-$runner"
          previous=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CONFIG_DIR"
          git commit -m "Update unified attention configs for $runner"
          git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$branch" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title "Update unified attention configs for $runner" --body-file "$RUNNER_TEMP/ua-tuning-pr.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$branch" \
              --title "Update unified attention configs for $runner" --body-file "$RUNNER_TEMP/ua-tuning-pr.md"
          fi
