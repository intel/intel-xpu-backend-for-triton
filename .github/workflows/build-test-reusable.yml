name: Build and test reusable workflow
run-name: ${{ inputs.run_name }} - ${{ inputs.python_version }} - ${{ inputs.runner_label || 'default'}}

on:
  workflow_call:
    inputs:
      device:
        description: Device
        type: string
        default: max1100
      driver_version:
        description: Driver version
        type: string
        default: rolling
      runner_label:
        description: Runner label, keep empty for default
        type: string
        default: ""
      pytorch_ref:
        description: PyTorch ref, keep empty for default
        type: string
        default: ""
      pytorch_mode:
        description: PyTorch mode, source or wheels
        type: string
        default: "source"
      python_version:
        description: Python version
        type: string
        required: true
      upload_test_reports:
        description: Upload test reports
        type: boolean
        default: false
      ignore_errors:
        description: Ignore test errors
        type: boolean
        default: false
      skip_list:
        description: Skip list
        type: string
        default: ""
      run_name:
        description: Custom run name
        type: string
        default: Build and test
      build_llvm:
        description: Build LLVM
        type: boolean
        default: false
      enable_unskip:
        description: Ignore pytest.skip
        type: boolean
        default: false
      runner_version:
        description: Runner label for version
        type: string
        default: runner-0.0.22
      use_pyenv_python:
        description: Use Python built with pyenv
        type: boolean
        default: false
      use_spirv_backend:
        description: Use SPIR-V backend
        type: boolean
        default: false
      warmup_on_cpu:
        description: Warm the Triton compile cache once on a CPU runner instead of on each GPU runner
        type: boolean
        default: false

permissions: read-all

env:
  TRITON_DISABLE_LINE_INFO: 1
  TEST_UNSKIP: ${{ inputs.enable_unskip }}
  # Increase this value to reset cache
  PIP_CACHE_NUMBER: 1
  # Number of shards for the suites listed in PARALLEL_SUITES
  NUM_SHARDS: 2
  # Suites that are split into NUM_SHARDS shards, each shard runs on its own runner
  PARALLEL_SUITES: ""
  # Suites that are run without sharding, one runner per suite
  SEQUENTIAL_SUITES: "minicore language_and_scaled_dot gluon triton-kernels rest"

jobs:
  build:
    name: Build
    timeout-minutes: 720
    runs-on: ${{ fromJson(inputs.runner_label && format('["linux", "{0}"]', inputs.runner_label) || format('["linux", "{0}", "{1}", "{2}"]', inputs.device, inputs.driver_version, inputs.runner_version)) }}
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    outputs:
      test-triton-command: ${{ steps.test-triton.outputs.command }}
      integration-tests-matrix: ${{ steps.test-triton.outputs.matrix }}
      artifact-label: ${{ steps.artifact-label.outputs.name }}
    steps:
      - name: Print inputs
        run: |
          cat <<EOF
          ${{ toJSON(inputs) }}
          EOF

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute artifact label
        id: artifact-label
        uses: ./.github/actions/sanitize-artifact-name
        with:
          name: ${{ inputs.runner_label || inputs.driver_version }}

      - name: Load pip cache
        id: pip-cache
        uses: ./.github/actions/load
        with:
          path: $HOME/.cache/pip
          key: pip-${{ inputs.python_version }}-${{ hashFiles('pyproject.toml', 'setup.py') }}-${{ env.PIP_CACHE_NUMBER }}

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}
          use_pyenv: ${{ inputs.use_pyenv_python }}

      # Build PyTorch here once, integration tests jobs should load it from cache.
      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          ref: ${{ inputs.pytorch_ref }}
          mode: ${{ inputs.pytorch_mode }}
          lts: ${{ inputs.runner_label == 'lts' || inputs.driver_version == 'lts' }}

      - name: Build Triton
        uses: ./.github/actions/setup-triton
        with:
          build_llvm: ${{ inputs.build_llvm }}
          use_spirv_backend: ${{ inputs.use_spirv_backend }}
          command: >
            DEBUG=1
            python -m build --wheel --no-isolation && pip install dist/*.whl

      # Lets the warmup-cache job compile for this exact device without having it.
      - name: Dump XPU target
        if: ${{ inputs.warmup_on_cpu }}
        run: |
          python scripts/dump_xpu_target.py xpu-target.json

      - name: Upload XPU target
        if: ${{ inputs.warmup_on_cpu }}
        uses: actions/upload-artifact@v7
        with:
          name: xpu-target-${{ inputs.python_version }}-${{ steps.artifact-label.outputs.name }}
          path: xpu-target.json

      - name: Set test-triton command line
        id: test-triton
        run: |
          skiplist="$GITHUB_WORKSPACE/scripts/skiplist/default"

          if [[ -n "${{ inputs.skip_list }}" ]]; then
            skiplist="$GITHUB_WORKSPACE/scripts/skiplist/${{ inputs.skip_list }}"
          elif [[ -n "${{ inputs.driver_version }}" ]]; then
            skiplist="$GITHUB_WORKSPACE/scripts/skiplist/${{ inputs.driver_version }}"
          fi

          if [ -d "$skiplist" ]; then
            skiplist="--skip-list $skiplist"
          else
            skiplist="--skip-list $GITHUB_WORKSPACE/scripts/skiplist/default"
          fi

          TRITON_TEST_CMD="bash -x scripts/test-triton.sh --skip-pip-install --warning-reports --skip-pytorch-install --reports-dir $GITHUB_WORKSPACE/reports ${{ inputs.ignore_errors && '--ignore-errors' || '' }} $skiplist"
          echo "command=$TRITON_TEST_CMD" | tee -a $GITHUB_OUTPUT
          echo "TRITON_TEST_CMD=$TRITON_TEST_CMD" | tee -a $GITHUB_ENV

          matrix=''
          if [ ! -z "$PARALLEL_SUITES" ] && [ "$NUM_SHARDS" -gt 0 ]; then
            for s in $PARALLEL_SUITES; do
              for n in $(seq 0 $(( NUM_SHARDS - 1 ))); do
                matrix="$matrix, {\"suite\":\"$s\",\"shard_id\":$n}"
              done
            done
          fi
          for s in $SEQUENTIAL_SUITES; do
            matrix="$matrix, {\"suite\":\"$s\",\"shard_id\":-1}"
          done
          echo "matrix=[${matrix#,}]" | tee -a $GITHUB_OUTPUT

      - name: Install test dependencies
        run: |
          pip install -r scripts/requirements-test.txt git+https://github.com/kwasd/pytest-capturewarnings-ng@c7c4c74fb8342c3df9d2d7693cf0a426c7736ecd

      # Unit tests require `build` directory.
      - name: Run unit tests
        run: |
          ${{ env.TRITON_TEST_CMD }} --unit

      # Instrumentation tests require `build` directory.
      - name: Run instrumentation tests
        run: |
          ${{ env.TRITON_TEST_CMD }} --instrumentation

      - name: Save pip cache
        if: ${{ steps.pip-cache.outputs.status == 'miss' }}
        uses: ./.github/actions/save
        with:
          path: ${{ steps.pip-cache.outputs.path }}
          dest: ${{ steps.pip-cache.outputs.dest }}

      - name: Upload Triton wheels
        uses: actions/upload-artifact@v7
        with:
          name: triton-${{ inputs.python_version }}-${{ steps.artifact-label.outputs.name }}
          path: dist/*.whl

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-build-${{ inputs.python_version }}-${{ steps.artifact-label.outputs.name }}
          include-hidden-files: true
          path: reports

  warmup-cache:
    name: Warm compile cache
    if: ${{ inputs.warmup_on_cpu }}
    needs: build
    timeout-minutes: 720
    runs-on: ${{ fromJson(format('["linux", "cpu", "{0}"]', inputs.runner_version)) }}
    env:
      TRITON_XPU_GEN_NATIVE_CODE: 1
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load pip cache
        id: pip-cache
        uses: ./.github/actions/load
        with:
          path: $HOME/.cache/pip
          key: pip-${{ inputs.python_version }}-warmup-${{ hashFiles('pyproject.toml', 'setup.py') }}-${{ env.PIP_CACHE_NUMBER }}

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}
          use_pyenv: ${{ inputs.use_pyenv_python }}

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          ref: ${{ inputs.pytorch_ref }}
          mode: ${{ inputs.pytorch_mode }}
          lts: ${{ inputs.runner_label == 'lts' || inputs.driver_version == 'lts' }}

      - name: Download Triton wheels
        uses: actions/download-artifact@v8
        with:
          name: triton-${{ inputs.python_version }}-${{ needs.build.outputs.artifact-label }}

      - name: Download XPU target
        uses: actions/download-artifact@v8
        with:
          name: xpu-target-${{ inputs.python_version }}-${{ needs.build.outputs.artifact-label }}

      - name: Install Triton
        run: |
          pip install triton-*.whl
          python -c 'import triton; print(triton.__version__)'

      - name: Install test dependencies
        run: |
          pip install -r scripts/requirements-test.txt git+https://github.com/kwasd/pytest-capturewarnings-ng@c7c4c74fb8342c3df9d2d7693cf0a426c7736ecd

      # This runner has no GPU: Triton compiles for the device recorded by the build job.
      - name: Set warmup environment
        run: |
          echo "TRITON_TEST_CMD=${{ needs.build.outputs.test-triton-command }}" | tee -a $GITHUB_ENV
          echo "TRITON_INTEL_TARGET_JSON=$GITHUB_WORKSPACE/xpu-target.json" | tee -a $GITHUB_ENV
          echo "TRITON_CI_COMPILE_TRACE_DIR=$RUNNER_TEMP/triton-ci-compile-trace" | tee -a $GITHUB_ENV

      - name: Warm regression compile cache
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/regression
          skiplist-name: regression
          pytest-targets: . --ignore=test_performance.py
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Warm language compile cache
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/unit
          skiplist-name: language
          pytest-targets: >-
            language/
            --ignore=language/test_line_info.py --ignore=language/test_matmul.py
            --ignore=language/test_subprocess.py --ignore=language/test_warp_specialization.py
            -k "not test_mxfp and not test_scaled_dot"
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Warm matmul compile cache
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/unit
          skiplist-name: matmul
          pytest-targets: >-
            language/test_matmul.py
            -k "not test_mxfp and not test_preshuffle_scale_mxfp_cdna4 or test_mxfp8_mxfp4_matmul"
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Warm scaled_dot compile cache
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/unit
          skiplist-name: scaled_dot
          pytest-targets: language/test_core.py -k "test_scaled_dot"
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Warm gluon compile cache
        if: inputs.driver_version == 'rolling'
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/gluon
          skiplist-name: gluon
          pytest-targets: .
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Warm Triton Kernels compile cache
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/triton_kernels
          skiplist-name: triton_kernels
          pytest-targets: tests -k 'not test_mxfp'
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Warm Flash Attention tutorials compile cache
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/tutorials
          skiplist-name: tutorials
          pytest-targets: test_tutorials.py --tutorial06-mode fa_only
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      # The cache directory is recorded in the compile trace, the test jobs rewrite it to their own.
      - name: Collect compile cache
        run: |
          out="$RUNNER_TEMP/warmup"
          mkdir -p "$out"
          cache_dir="$(python -c 'import triton; print(triton.knobs.cache.dir)')"
          echo "$cache_dir" > "$out/cache_dir"
          cp -r "$cache_dir" "$out/cache"
          cp -r "$TRITON_CI_COMPILE_TRACE_DIR" "$out/trace"
          du -sh "$out/cache" "$out/trace"

      - name: Upload compile cache
        uses: actions/upload-artifact@v7
        with:
          name: triton-compile-cache-${{ inputs.python_version }}-${{ needs.build.outputs.artifact-label }}
          path: ${{ runner.temp }}/warmup
          retention-days: 1

      - name: Save pip cache
        if: ${{ steps.pip-cache.outputs.status == 'miss' }}
        uses: ./.github/actions/save
        with:
          path: ${{ steps.pip-cache.outputs.path }}
          dest: ${{ steps.pip-cache.outputs.dest }}

  integration-tests:
    name: ${{ format('Integration tests {0}{1}', matrix.loop.suite, matrix.loop.shard_id >= 0 && format(' - shard {0}', matrix.loop.shard_id) || '') }}
    needs:
      - build
      - warmup-cache
    # warmup-cache is skipped when warmup_on_cpu is false
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.warmup-cache.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        loop: ${{ fromJson(needs.build.outputs.integration-tests-matrix) }}
    timeout-minutes: 720
    runs-on: ${{ fromJson(inputs.runner_label && format('["linux", "{0}"]', inputs.runner_label) || format('["linux", "{0}", "{1}", "{2}"]', inputs.device, inputs.driver_version, inputs.runner_version)) }}
    env:
      TRITON_XPU_GEN_NATIVE_CODE: 1
      PYTEST_ADDOPTS: "-p triton._compile_warmup"
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - name: Print inputs
        run: |
          cat <<EOF
          ${{ toJSON(inputs) }}
          EOF

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load pip cache
        id: pip-cache
        uses: ./.github/actions/load
        with:
          path: $HOME/.cache/pip
          key: pip-${{ inputs.python_version }}-${{ matrix.loop.suite }}-${{ hashFiles('pyproject.toml', 'setup.py') }}-${{ env.PIP_CACHE_NUMBER }}

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}
          use_pyenv: ${{ inputs.use_pyenv_python }}

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          ref: ${{ inputs.pytorch_ref }}
          mode: ${{ inputs.pytorch_mode }}
          lts: ${{ inputs.runner_label == 'lts' || inputs.driver_version == 'lts' }}

      - name: Download Triton wheels
        uses: actions/download-artifact@v8
        with:
          name: triton-${{ inputs.python_version }}-${{ needs.build.outputs.artifact-label }}

      - name: Install Triton
        run: |
          pip install triton-*.whl
          python -c 'import triton; print(triton.__version__)'

      - name: Report environment details
        timeout-minutes: 1
        run: |
          if [ "${{ matrix.loop.suite }}" == "minicore" ]; then
            reports_file="reports/.env"
          else
            reports_file="/dev/null"
          fi

          mkdir -p reports
          cat <<EOF | tee "$reports_file"
          TIMESTAMP=$(date '+%Y%m%d%H%M%S')
          GITHUB_RUN_ID=$GITHUB_RUN_ID
          GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER
          GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          PYTHON_VERSION=${{ inputs.python_version }}
          PYTORCH_REPO=$PYTORCH_REPO
          PYTORCH_COMMIT_ID=$PYTORCH_COMMIT_ID
          PYTORCH_VERSION=$PYTORCH_VERSION
          TRITON_REPO=$GITHUB_REPOSITORY
          TRITON_COMMIT_ID=$GITHUB_SHA
          TRITON_BRANCH=$GITHUB_REF_NAME
          OS=${{ runner.os }}
          EOF
          ./scripts/capture-hw-details.sh | tee -a "$reports_file"

      - name: Install test dependencies
        run: |
          pip install -r scripts/requirements-test.txt git+https://github.com/kwasd/pytest-capturewarnings-ng@c7c4c74fb8342c3df9d2d7693cf0a426c7736ecd

      - name: Set test-triton command line
        run: |
          echo "TRITON_TEST_CMD=${{ needs.build.outputs.test-triton-command }}" | tee -a $GITHUB_ENV

      - name: Set compile warmup trace directory
        run: |
          echo "TRITON_CI_COMPILE_TRACE_DIR=$RUNNER_TEMP/triton-ci-compile-trace" | tee -a $GITHUB_ENV

      - name: Download compile cache warmed on CPU
        if: ${{ inputs.warmup_on_cpu }}
        uses: actions/download-artifact@v8
        with:
          name: triton-compile-cache-${{ inputs.python_version }}-${{ needs.build.outputs.artifact-label }}
          path: ${{ runner.temp }}/warmup

      - name: Install compile cache warmed on CPU
        if: ${{ inputs.warmup_on_cpu }}
        run: |
          cache_dir="$(python -c 'import triton; print(triton.knobs.cache.dir)')"
          rm -rf "$cache_dir" "$TRITON_CI_COMPILE_TRACE_DIR"
          mkdir -p "$(dirname "$cache_dir")"
          mv "$RUNNER_TEMP/warmup/cache" "$cache_dir"
          mv "$RUNNER_TEMP/warmup/trace" "$TRITON_CI_COMPILE_TRACE_DIR"
          # `report --require-complete` pairs warmup and test records by (cache dir, hash).
          old_dir="$(<"$RUNNER_TEMP/warmup/cache_dir")"
          find "$TRITON_CI_COMPILE_TRACE_DIR" -name '*.jsonl' -exec \
            sed -i "s|\"cache_dir\": \"$old_dir\"|\"cache_dir\": \"$cache_dir\"|" {} +

      - name: Determine number of shards for current suite
        run: |
          SUITE="${{ matrix.loop.suite }}"

          if echo "$PARALLEL_SUITES" | grep -qw "$SUITE"; then
            NUM_SHARDS_FOR_SUITE="$NUM_SHARDS"
          else
            NUM_SHARDS_FOR_SUITE=1
          fi

          echo "NUM_SHARDS_FOR_SUITE=$NUM_SHARDS_FOR_SUITE" | tee -a $GITHUB_ENV

      - name: Run Proton tests
        if: matrix.loop.suite == 'rest'
        run: |
          ${{ env.TRITON_TEST_CMD }} --proton

      - name: Warm regression compile cache
        if: matrix.loop.suite == 'minicore' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/regression
          skiplist-name: regression
          pytest-targets: . --ignore=test_performance.py
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run minicore tests
        if: matrix.loop.suite == 'minicore'
        run: |
          ${{ env.TRITON_TEST_CMD }} --minicore

      - name: Warm language compile cache
        if: matrix.loop.suite == 'language_and_scaled_dot' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/unit
          skiplist-name: language
          pytest-targets: >-
            language/
            --ignore=language/test_line_info.py --ignore=language/test_matmul.py
            --ignore=language/test_subprocess.py --ignore=language/test_warp_specialization.py
            -k "not test_mxfp and not test_scaled_dot"
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run language tests
        if: matrix.loop.suite == 'language_and_scaled_dot'
        run: |
          ${{ env.TRITON_TEST_CMD }} --language

      - name: Warm matmul compile cache
        if: matrix.loop.suite == 'rest' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/unit
          skiplist-name: matmul
          pytest-targets: >-
            language/test_matmul.py
            -k "not test_mxfp and not test_preshuffle_scale_mxfp_cdna4 or test_mxfp8_mxfp4_matmul"
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run matmul tests
        if: matrix.loop.suite == 'rest'
        run: |
          ${{ env.TRITON_TEST_CMD }} --matmul

      - name: Warm scaled_dot compile cache
        if: matrix.loop.suite == 'language_and_scaled_dot' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/unit
          skiplist-name: scaled_dot
          pytest-targets: language/test_core.py -k "test_scaled_dot"
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run scaled_dot tests
        if: matrix.loop.suite == 'language_and_scaled_dot'
        run: |
          ${{ env.TRITON_TEST_CMD }} --scaled-dot

      - name: Run debug tests
        if: matrix.loop.suite == 'rest'
        run: |
          ${{ env.TRITON_TEST_CMD }} --debug

      - name: Warm gluon compile cache
        if: matrix.loop.suite == 'gluon' && inputs.driver_version == 'rolling' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/gluon
          skiplist-name: gluon
          pytest-targets: .
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run gluon tests
        if: matrix.loop.suite == 'gluon' && inputs.driver_version == 'rolling'
        run: |
          ${{ env.TRITON_TEST_CMD }} --gluon

      - name: Run interpreter tests
        if: matrix.loop.suite == 'rest'
        run: |
          ${{ env.TRITON_TEST_CMD }} --interpreter

      - name: Warm Triton Kernels compile cache
        if: matrix.loop.suite == 'triton-kernels' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/triton_kernels
          skiplist-name: triton_kernels
          pytest-targets: tests -k 'not test_mxfp'
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run triton kernels tests
        if: matrix.loop.suite == 'triton-kernels'
        run: |
          export PYTEST_MAX_PROCESSES=4
          ${{ env.TRITON_TEST_CMD }} --triton-kernels

      - name: Run Tutorials
        if: matrix.loop.suite == 'rest'
        run: |
          export TRITON_AUTOTUNE_WARMUP_WORKERS="$(( $(nproc) * 60 / 100 ))"
          ${{ env.TRITON_TEST_CMD }} --tutorial --tutorial06-run-mode skip

      - name: Warm Flash Attention tutorials compile cache
        if: matrix.loop.suite == 'rest' && !inputs.warmup_on_cpu
        uses: ./.github/actions/warm-compile-cache
        with:
          working-directory: python/test/tutorials
          skiplist-name: tutorials
          pytest-targets: test_tutorials.py --tutorial06-mode fa_only
          ignore-errors: ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Run Flash Attention tutorials
        if: matrix.loop.suite == 'rest'
        run: |
          ${{ env.TRITON_TEST_CMD }} --tutorial06-run-mode fa_only

      # Skipped when gluon has no warmup to compare against (see the gluon steps above).
      - name: Verify compile warmup completeness
        if: matrix.loop.suite != 'gluon' || inputs.driver_version == 'rolling'
        run: |
          python -m triton._test_runner report --require-complete \
            || ${{ inputs.ignore_errors || inputs.enable_unskip }}

      - name: Save pip cache
        if: ${{ steps.pip-cache.outputs.status == 'miss' }}
        uses: ./.github/actions/save
        with:
          path: ${{ steps.pip-cache.outputs.path }}
          dest: ${{ steps.pip-cache.outputs.dest }}

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.loop.suite }}-${{ matrix.loop.shard_id || 0 }}-${{ inputs.python_version }}-${{ needs.build.outputs.artifact-label }}
          include-hidden-files: true
          path: reports

  reports:
    name: Reports
    needs: integration-tests
    uses: ./.github/workflows/reports-reusable.yml
    with:
      python_version: ${{ inputs.python_version }}
      runner_label: ${{ inputs.runner_label }}
      driver_version: ${{ inputs.driver_version }}
      use_pyenv_python: ${{ inputs.use_pyenv_python }}
      runner_version: ${{ inputs.runner_version }}

  check-jobs:
    runs-on: runner-0.0.22
    if: always()
    needs:
      - build
      - warmup-cache
      - integration-tests
      - reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}
          use_pyenv: ${{ inputs.use_pyenv_python }}

      - name: Ensure job status
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: warmup-cache
