name: Test SPIRVRunner

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: read-all

env:
  PYTHON_VERSION: '3.11'

jobs:
  tests:
    name: Tests
    runs-on:
      - rolling
      - runner-0.0.22
    timeout-minutes: 160
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch

      - name: Setup Triton
        uses: ./.github/actions/setup-triton

      - name: Build and test SPIRVRunner
        uses: ./.github/actions/test-spirvrunner
