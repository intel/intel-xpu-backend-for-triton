name: PyTorch wheels (Linux)

# Builds the PyTorch wheel at the pin for the CI Python version.
# On a cache miss, setup-pytorch installs the wheel from the latest successful run of this workflow on main,
# if its cache key matches the runner's. Only runs on main of this repository are trusted, so keep it to main.
# If the key has not changed, a run reuses the previous wheel instead of building.
# Only successful runs count: after a failure, re-run the failed jobs.
# After a oneAPI update on the runners, run this workflow manually so the key matches again.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/pins/pytorch.txt
      - scripts/patch-pytorch.sh
      - scripts/patch/**
      - .github/actions/setup-pytorch/**
      - .github/workflows/wheels-pytorch-linux.yml

permissions: read-all

# One build at a time; a newer queued run replaces an older queued one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PyTorch
    # Rolling max1550, the E2E default; jobs on other runners install the wheel only when their oneAPI matches
    runs-on:
      - linux
      - rolling
      - max1550
    timeout-minutes: 720
    strategy:
      matrix:
        python:
          # Keep in sync with the Python version of the CI jobs that build PyTorch
          - "3.11"
      fail-fast: false
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ matrix.python }}

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          # setup-pytorch finds the wheel by this name
          upload_artifact: pytorch-py${{ matrix.python }}
