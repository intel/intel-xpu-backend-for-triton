name: vLLM benchmarks

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label, keep empty for default
        type: string
        default: ""
      tag:
        description: Tag for benchmark results
        type: string
        default: "test"
      vllm_pin:
        description: vLLM pin (commit hash), keep empty for default
        type: string
        default: ""
      kernels_hash:
        description: vLLM XPU kernels commit hash to build from source, keep empty to install vLLM's pinned release
        type: string
        default: ""
      grf_comparison_refs:
        description: JSON map of control, fixed256 and fixed256_8k commit hashes
        type: string
        default: ""
  workflow_call:
    inputs:
      runner_label:
        description: Runner label
        type: string
      tag:
        description: Tag for benchmark results
        type: string
        # Empty default so the TAG fallback below can resolve pr-<n>/ci from the
        # caller's event. A non-empty default would short-circuit that expression.
        default: ""
      vllm_pin:
        description: vLLM pin (commit hash), keep empty for default
        type: string
        default: ""
      kernels_hash:
        description: vLLM XPU kernels commit hash to build from source, keep empty to install vLLM's pinned release
        type: string
        default: ""
      grf_comparison_refs:
        description: JSON map of control, fixed256 and fixed256_8k commit hashes
        type: string
        default: ""

permissions: read-all

env:
  PYTHON_VERSION: "3.12"
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || (github.event_name == 'schedule' && 'ci') || 'test' }}
  HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
  GH_TOKEN: ${{ github.token }}
  # FIXME: Remove once CI has PTI 1.3 (expected in oneAPI 2026.3); older PTI hangs on PVC with PyTorch's event-less kernels
  PTI_COLLECTION_MODE: ${{ startsWith(inputs.runner_label, 'max') && '0' || '' }}

jobs:
  build:
    name: vLLM benchmarks
    runs-on:
      - linux
      - gpu
      - ${{ inputs.runner_label || 'b580' }}
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - name: Print inputs
        run: |
          cat <<EOF
          ${{ toJSON(inputs) }}
          EOF

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Override vLLM pin
        if: ${{ inputs.vllm_pin }}
        run: |
          echo "${{ inputs.vllm_pin }}" > scripts/vllm/vllm-pin.txt
          echo "Overriding vLLM pin to: ${{ inputs.vllm_pin }}"

      - name: Install Python (from pyenv) ${{ inputs.python_version }}
        uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Identify Python version
        run: |
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info[0]}.{ sys.version_info[1]}")')"
          echo "PYTHON_VERSION=$PYTHON_VERSION" | tee -a $GITHUB_ENV

      - name: Install Python build dependencies
        run: |
          pip install cmake

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          lts: ${{ inputs.runner_label == 'lts' }}

      - name: Setup Triton
        uses: ./.github/actions/setup-triton

      - name: Create reports dir
        run: |
          mkdir reports
          echo "REPORTS=$PWD/reports" >> $GITHUB_ENV

      - name: Install benchmark dependencies
        id: install
        run: |
          pip install transformers 'pandas<3.0' pytest

      - name: Install benchmarks from comparison snapshot
        id: install-benchmarks
        run: |
          pip uninstall -y triton-kernels-benchmark 2>/dev/null || true
          pip install --no-build-isolation ./benchmarks
          triton-benchmarks describe ALL

      - name: Install vllm
        id: install-vllm
        if: ${{ steps.install-benchmarks.outcome == 'success' && !cancelled() }}
        uses: ./.github/actions/install-vllm
        with:
          kernels-hash: ${{ inputs.kernels_hash }}

      - name: Report environment details
        timeout-minutes: 1
        run: |
          cat <<EOF | tee "$REPORTS/.env"
          TIMESTAMP=$(date '+%Y%m%d%H%M%S')
          GITHUB_RUN_ID=$GITHUB_RUN_ID
          GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER
          GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          PYTHON_VERSION=$PYTHON_VERSION
          TRITON_REPO=$GITHUB_REPOSITORY
          TRITON_COMMIT_ID=$GITHUB_SHA
          TRITON_BRANCH=$GITHUB_REF_NAME
          BENCHMARK_SOURCE_COMMIT=$(git rev-parse HEAD)
          BENCHMARK_SOURCE_SHA256=$(sha256sum benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention_benchmark.py | cut -d ' ' -f1)
          UA_PATCH_SHA256=$(sha256sum benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch | cut -d ' ' -f1)
          VLLM_PIN=$(cat scripts/vllm/vllm-pin.txt)
          VLLM_XPU_KERNELS_VERSION=$(pip show vllm-xpu-kernels | awk '/^Version:/ {print $2}')
          OS=${{ runner.os }}
          EOF
          ./scripts/capture-hw-details.sh | tee -a "$REPORTS/.env"

      - name: Run controlled attention GRF comparison
        if: ${{ steps.install-vllm.outcome == 'success' && inputs.grf_comparison_refs && !cancelled() }}
        env:
          GRF_COMPARISON_REFS: ${{ inputs.grf_comparison_refs }}
        run: |
          source ./scripts/capture-hw-details.sh
          python scripts/vllm/compare_ua_grf.py --refs "$GRF_COMPARISON_REFS" --reports "$REPORTS" --tag "$TAG"

      - name: Run vllm unified attention bf16
        if: ${{ steps.install-vllm.outcome == 'success' && !inputs.grf_comparison_refs && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          bash run_benchmark.sh unified_attention --reports $REPORTS --tag $TAG

      - name: Run vllm unified attention fp8
        if: ${{ steps.install-vllm.outcome == 'success' && !inputs.grf_comparison_refs && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          FP8="1" bash run_benchmark.sh unified_attention --reports $REPORTS --tag $TAG

      - name: Run vllm batched moe bf16
        if: ${{ steps.install-vllm.outcome == 'success' && !inputs.grf_comparison_refs && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          bash run_benchmark.sh batched_moe --reports $REPORTS --tag $TAG


      - name: Run vllm batched moe fp8
        if: ${{ steps.install-vllm.outcome == 'success' && !inputs.grf_comparison_refs && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          FP8="1" bash run_benchmark.sh batched_moe --reports $REPORTS --tag $TAG

      - name: Run vllm fused moe bf16
        if: ${{ steps.install-vllm.outcome == 'success' && !inputs.grf_comparison_refs && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          bash run_benchmark.sh fused_moe --reports $REPORTS --tag $TAG

      - name: Upload benchmark reports
        if: ${{ always() && steps.install.outcome == 'success' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports-vllm
          path: reports
