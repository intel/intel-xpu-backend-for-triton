name: UA same-runner diagnostic
run-name: UA diagnostic on B580 (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      main_ref:
        description: Pinned main commit supplying the online UA patch
        type: string
        default: '0849431d24201f4a249636fda4c4eac559406bb2'

permissions:
  contents: read
  actions: read

concurrency:
  group: ua-same-runner-diagnostic
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  diagnostic:
    runs-on: [linux, b580]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install cmake
      - uses: ./.github/actions/setup-pytorch
      - uses: ./.github/actions/setup-triton
      - uses: ./.github/actions/install-vllm
      - name: Record environment
        run: |
          mkdir -p reports
          ./scripts/capture-hw-details.sh > reports/environment.txt
          python -m pip freeze > reports/packages.txt
          git rev-parse HEAD > reports/compiler-checkout.txt
          git diff 0ea7fbf49e45b4cf1a3881a66ade4f3ba5a5c7ed -- python third_party include lib cmake > reports/compiler-changes.diff
          test ! -s reports/compiler-changes.diff
      - name: Compare main and offline UA
        env:
          MAIN_REF: ${{ inputs.main_ref }}
          TRITON_CACHE_DIR: ${{ runner.temp }}/ua-diagnostic-${{ github.run_id }}
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/ua_ci_diagnostic.py \
            --vllm-source "$PWD/vllm" \
            --main-ref "$MAIN_REF" \
            --output "$PWD/reports/ua" 2>&1 | tee reports/diagnostic.log
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/ua/REPORT.md ]; then
            cat reports/ua/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ua-same-runner-diagnostic
          path: reports
          if-no-files-found: warn
