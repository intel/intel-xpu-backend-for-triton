name: UA offline tuning with cold graph replay
run-name: UA CI-input tuning on B580 (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      part:
        description: Tuning part to run (both runs sequentially)
        type: choice
        default: both
        options: [both, '1', '2']

permissions:
  contents: read
  actions: read

concurrency:
  group: ua-ci-offline-tune
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TRITON_CACHE_DIR: ${{ github.workspace }}/.ua-tuning-cache-${{ github.run_id }}

jobs:
  tune:
    name: Tune part ${{ matrix.part }} of 2
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ${{ fromJSON(inputs.part == 'both' && '[1,2]' || format('[{0}]', inputs.part)) }}
    runs-on: [linux, b580]
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install cmake
      - uses: ./.github/actions/setup-pytorch
      - uses: ./.github/actions/setup-triton
      - uses: ./.github/actions/install-vllm
      - name: Record environment and inputs
        run: |
          mkdir -p reports/profiles
          ./scripts/capture-hw-details.sh > reports/environment.txt
          python -m pip freeze > reports/packages.txt
          git rev-parse HEAD > reports/checkout.txt
          python scripts/ua_ci_shard.py --part ${{ matrix.part }} --output reports/manifests
          cp scripts/ua-ci-tuning-shards.json reports/
          git diff 0ea7fbf49e45b4cf1a3881a66ade4f3ba5a5c7ed -- python third_party include lib cmake > reports/compiler-changes.diff
          test ! -s reports/compiler-changes.diff
      - name: Check cold graph timing against CI profiler
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/ua_ci_diagnostic.py --clear-cache \
            --vllm-source "$PWD/vllm" --output "$PWD/reports/timing-check" \
            2>&1 | tee reports/timing-check.log
          python scripts/ua_check_cold_timing.py reports/timing-check/results.json
      - name: Apply offline UA patch
        run: |
          git -C vllm apply --check "$PWD/benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch"
          git -C vllm apply "$PWD/benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch"
      - name: Tune BF16 inputs for this part
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/ua_ci_tune.py --tune --clear-cache \
            --manifest reports/manifests/bfloat16.json \
            --save-dir reports/profiles --measurements reports/bf16-measurements.json \
            --warmup-ms 25 --rep-ms 100 2>&1 | tee reports/bf16-tuning.log
      - name: Save BF16 profiles and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ua-cold-graph-part-${{ matrix.part }}-bf16-checkpoint
          path: reports
          if-no-files-found: warn
      - name: Tune FP8 inputs for this part
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/ua_ci_tune.py --tune --clear-cache \
            --manifest reports/manifests/float8_e4m3fn.json \
            --save-dir reports/profiles --measurements reports/fp8-measurements.json \
            --warmup-ms 25 --rep-ms 100 2>&1 | tee reports/fp8-tuning.log
      - name: Upload generated JSONs and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ua-cold-graph-part-${{ matrix.part }}-profiles
          path: reports
          if-no-files-found: warn
