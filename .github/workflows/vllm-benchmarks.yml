name: timing test
run-name: timing test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ua-timing-test
  cancel-in-progress: false

env:
  TRITON_CACHE_DIR: ${{ github.workspace }}/.ua-timing-cache-${{ github.run_id }}

jobs:
  timing-test:
    name: timing test
    runs-on: [linux, b580]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install cmake
      - uses: ./.github/actions/setup-pytorch
      - uses: ./.github/actions/setup-triton
      - uses: ./.github/actions/install-vllm
      - name: Record environment
        run: |
          mkdir -p reports
          ./scripts/capture-hw-details.sh > reports/environment.txt
          python -m pip freeze > reports/packages.txt
          git rev-parse HEAD > reports/checkout.txt
          printf '%s\n' "$RUNNER_NAME" > reports/runner.txt
          git -C vllm rev-parse HEAD > reports/vllm-pin.txt
      - name: Prepare main TD attention source
        run: |
          mkdir -p reports/main-source/vllm/v1/attention
          cp -r vllm/vllm/v1/attention/ops reports/main-source/vllm/v1/attention/
          git show 0849431d24201f4a249636fda4c4eac559406bb2:benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch > reports/main.patch
          git -C reports/main-source init -q
          git -C reports/main-source apply --check --include='vllm/v1/attention/ops/*' "$PWD/reports/main.patch"
          git -C reports/main-source apply --include='vllm/v1/attention/ops/*' "$PWD/reports/main.patch"
      - name: Preview timing matrix
        run: |
          python scripts/ua_timing_probe.py --repo "$PWD" --output reports/matrix \
            --workload matmul_short matmul_long ua_decode ua_prefill ua_mixed \
            --trials 2 --dry-run > reports/planned-matrix.json
      - name: Compare event and wall timings in fresh processes
        run: |
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/ua_timing_probe.py --repo "$PWD" \
            --ua-source "$PWD/reports/main-source" --output "$PWD/reports/matrix" \
            --workload matmul_short matmul_long ua_decode ua_prefill ua_mixed \
            --trials 2 --rounds 3 --repeats 12 2>&1 | tee reports/probe.log
      - name: Upload timings, traces, and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-test-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
