name: vLLM benchmarks

on:
  workflow_dispatch:
    inputs:
      head_group_resume_run:
        description: Resume unfinished head-group cases from this run across four shards
        type: string
        default: ""
      head_group_ablation:
        description: Run the paired full-group versus expanded head-group experiment only
        type: boolean
        default: false
      runner_label:
        description: Runner label, keep empty for default
        type: string
        default: ""
      tag:
        description: Tag for benchmark results
        type: string
        default: "test"
      vllm_pin:
        description: vLLM pin (commit hash), keep empty for default
        type: string
        default: ""
      kernels_hash:
        description: vLLM XPU kernels commit hash to build from source, keep empty to install vLLM's pinned release
        type: string
        default: ""
  workflow_call:
    inputs:
      head_group_resume_run:
        description: Resume unfinished head-group cases from this run across four shards
        type: string
        default: ""
      head_group_ablation:
        description: Run the paired full-group versus expanded head-group experiment only
        type: boolean
        default: false
      runner_label:
        description: Runner label
        type: string
      tag:
        description: Tag for benchmark results
        type: string
        # Empty default so the TAG fallback below can resolve pr-<n>/ci from the
        # caller's event. A non-empty default would short-circuit that expression.
        default: ""
      vllm_pin:
        description: vLLM pin (commit hash), keep empty for default
        type: string
        default: ""
      kernels_hash:
        description: vLLM XPU kernels commit hash to build from source, keep empty to install vLLM's pinned release
        type: string
        default: ""

permissions: read-all

env:
  PYTHON_VERSION: "3.12"
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || (github.event_name == 'schedule' && 'ci') || 'test' }}
  HF_TOKEN: ${{ secrets.HF_TOKEN || '' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: ${{ inputs.head_group_resume_run && format('Head-group ablation shard {0}', matrix.ablation_shard) || 'vLLM benchmarks' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ablation_shard: ${{ fromJSON(inputs.head_group_ablation && inputs.head_group_resume_run != '' && '[0,1,2,3]' || '[0]') }}
    runs-on:
      - linux
      - ${{ inputs.runner_label || 'b580' }}
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    steps:
      - name: Print inputs
        run: |
          cat <<EOF
          ${{ toJSON(inputs) }}
          EOF

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Override vLLM pin
        if: ${{ inputs.vllm_pin }}
        run: |
          echo "${{ inputs.vllm_pin }}" > scripts/vllm/vllm-pin.txt
          echo "Overriding vLLM pin to: ${{ inputs.vllm_pin }}"

      - name: Install Python (from pyenv) ${{ inputs.python_version }}
        uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Identify Python version
        run: |
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info[0]}.{ sys.version_info[1]}")')"
          echo "PYTHON_VERSION=$PYTHON_VERSION" | tee -a $GITHUB_ENV

      - name: Install Python build dependencies
        run: |
          pip install cmake

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          lts: ${{ inputs.runner_label == 'lts' }}

      - name: Setup Triton
        uses: ./.github/actions/setup-triton

      - name: Create reports dir
        run: |
          mkdir reports
          echo "REPORTS=$PWD/reports" >> $GITHUB_ENV

      - name: Install benchmark dependencies
        id: install
        run: |
          pip install transformers 'pandas<3.0' pytest

      - name: Install benchmarks
        id: install-benchmarks
        if: ${{ !inputs.head_group_ablation }}
        uses: ./.github/actions/install-benchmarks
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          github-token: ${{ github.token }}

      - name: Install vllm
        id: install-vllm
        if: ${{ (inputs.head_group_ablation || steps.install-benchmarks.outcome == 'success') && !cancelled() }}
        uses: ./.github/actions/install-vllm
        with:
          kernels-hash: ${{ inputs.kernels_hash }}

      - name: Report environment details
        timeout-minutes: 1
        run: |
          cat <<EOF | tee "$REPORTS/.env"
          TIMESTAMP=$(date '+%Y%m%d%H%M%S')
          GITHUB_RUN_ID=$GITHUB_RUN_ID
          GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER
          GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          PYTHON_VERSION=$PYTHON_VERSION
          TRITON_REPO=$GITHUB_REPOSITORY
          TRITON_COMMIT_ID=$GITHUB_SHA
          TRITON_BRANCH=$GITHUB_REF_NAME
          VLLM_PIN=$(cat scripts/vllm/vllm-pin.txt)
          VLLM_XPU_KERNELS_VERSION=$(pip show vllm-xpu-kernels | awk '/^Version:/ {print $2}')
          OS=${{ runner.os }}
          EOF
          ./scripts/capture-hw-details.sh | tee -a "$REPORTS/.env"

      - name: Download completed head-group measurements
        if: ${{ inputs.head_group_ablation && inputs.head_group_resume_run != '' }}
        uses: actions/download-artifact@v7
        with:
          name: benchmark-reports
          github-token: ${{ github.token }}
          run-id: ${{ inputs.head_group_resume_run }}
          path: ${{ runner.temp }}/ua-head-group-resume

      - name: Run paired head-group ablation
        if: ${{ inputs.head_group_ablation && steps.install-vllm.outcome == 'success' && !cancelled() }}
        env:
          TRITON_CACHE_DIR: ${{ runner.temp }}/ua-head-group-ablation-cache
          TRITON_XPU_GEN_NATIVE_CODE: "1"
          HEAD_GROUP_RESUME_RUN: ${{ inputs.head_group_resume_run }}
          HEAD_GROUP_SHARD_INDEX: ${{ matrix.ablation_shard }}
        run: |
          source ./scripts/capture-hw-details.sh
          git -C vllm apply "$PWD/benchmarks/triton_kernels_benchmark/vllm/unified_attention/unified_attention.patch"
          export PYTHONPATH="$PWD/vllm${PYTHONPATH:+:$PYTHONPATH}"
          resume_args=()
          if [[ -n "$HEAD_GROUP_RESUME_RUN" ]]; then
            resume_args=(--resume-from "$RUNNER_TEMP/ua-head-group-resume/head-group-ablation" --shard-index "$HEAD_GROUP_SHARD_INDEX" --shard-count 4)
          fi
          python scripts/vllm/head_group_ablation.py --plan-only --output "$REPORTS/head-group-ablation" "${resume_args[@]}"
          python -u scripts/vllm/head_group_ablation.py --output "$REPORTS/head-group-ablation" "${resume_args[@]}" 2>&1 | tee "$REPORTS/head-group-ablation.log"

      - name: Run vllm unified attention bf16
        if: ${{ !inputs.head_group_ablation && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          bash run_benchmark.sh unified_attention --reports $REPORTS --tag $TAG

      - name: Run vllm unified attention fp8
        if: ${{ !inputs.head_group_ablation && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          FP8="1" bash run_benchmark.sh unified_attention --reports $REPORTS --tag $TAG

      - name: Run vllm batched moe bf16
        if: ${{ !inputs.head_group_ablation && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          bash run_benchmark.sh batched_moe --reports $REPORTS --tag $TAG


      - name: Run vllm batched moe fp8
        if: ${{ !inputs.head_group_ablation && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          FP8="1" bash run_benchmark.sh batched_moe --reports $REPORTS --tag $TAG

      - name: Run vllm fused moe bf16
        if: ${{ !inputs.head_group_ablation && steps.install-vllm.outcome == 'success' && !cancelled() }}
        run: |
          source ./scripts/capture-hw-details.sh

          cd benchmarks/triton_kernels_benchmark/vllm
          bash run_benchmark.sh fused_moe --reports $REPORTS --tag $TAG

      - name: Upload benchmark reports
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.head_group_resume_run && format('head-group-ablation-shard-{0}', matrix.ablation_shard) || 'benchmark-reports' }}
          path: reports

  summarize-head-group-ablation:
    name: Combine head-group ablation results
    needs: build
    if: ${{ always() && inputs.head_group_ablation && inputs.head_group_resume_run != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v7

      - name: Download shard measurements
        uses: actions/download-artifact@v7
        with:
          pattern: head-group-ablation-shard-*
          path: ablation-shards

      - name: Combine and verify all 97 cases
        run: |
          python3 scripts/vllm/head_group_ablation.py --merge-from ablation-shards --shard-count 4 --output reports/head-group-ablation

      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: head-group-ablation-combined
          path: reports
