name: PyTorch reference memory diagnostic
run-name: PyTorch reference memory check for PR 8595 (${{ inputs.tag }})

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Optional single GPU runner label; empty checks B580 and B60
        type: string
        default: ""
      tag:
        description: Diagnostic label
        type: string
        default: "pr-8595-memory"

permissions:
  contents: read

jobs:
  memory:
    name: PyTorch reference memory (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ inputs.runner_label != '' && fromJSON(format('["{0}"]', inputs.runner_label)) || fromJSON('["b580","b60"]') }}
    runs-on: [linux, "${{ matrix.runner }}"]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-pyenv-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: pip install cmake numpy

      - name: Setup pinned PyTorch
        uses: ./.github/actions/setup-pytorch

      - name: Report environment
        run: |
          mkdir -p reports
          git rev-parse HEAD | tee reports/commit.txt
          ./scripts/capture-hw-details.sh | tee reports/hardware.txt
          python -m pip freeze > reports/packages.txt

      - name: Test every PyTorch reference without the memory guard
        timeout-minutes: 150
        run: python scripts/probe-pytorch-reference-memory.py --reports reports/pytorch-reference-memory

      - name: Upload memory measurements and per-case logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytorch-reference-memory-${{ matrix.runner }}
          path: reports
