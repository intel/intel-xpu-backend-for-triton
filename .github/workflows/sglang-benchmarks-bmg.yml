name: SGLang benchmarks, BMG

permissions: read-all

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sglang-benchmarks*.yml
      - scripts/sglang/**
      - benchmarks/triton_kernels_benchmark/sglang/**
  schedule:
    - cron: "0 11 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'ci' }}
  cancel-in-progress: true

jobs:
  build-wheel:
    uses: ./.github/workflows/build-benchmarks-wheel.yml
    with:
      python-version: "3.12"

  benchmarks:
    needs: build-wheel
    if: always() && !cancelled()
    uses: ./.github/workflows/sglang-benchmarks.yml
    with:
      runner_label: b580
    secrets: inherit
