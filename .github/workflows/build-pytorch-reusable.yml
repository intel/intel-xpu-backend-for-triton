name: Build PyTorch reusable workflow

# Builds PyTorch (or loads it from cache) once per workflow run and uploads the wheel;
# e2e-reusable.yml installs it through its pytorch_artifact input.

on:
  workflow_call:
    inputs:
      pytorch_ref:
        description: PyTorch ref, keep empty for default
        type: string
        default: ""
      runner_label:
        description: Runner label, keep empty for default
        type: string
        default: ""
      python_version:
        description: Python version
        type: string
        # Must match PYTHON_VERSION in e2e-reusable.yml
        default: "3.11"
    outputs:
      artifact:
        description: Name of the artifact with the PyTorch wheel
        value: ${{ jobs.build.outputs.artifact }}

permissions: read-all

env:
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  build:
    name: Build PyTorch
    # Same runners as e2e-reusable.yml, so the host cache and the oneAPI in the cache key match the test jobs
    runs-on: ${{ fromJSON((inputs.runner_label == '' || startsWith(inputs.runner_label, 'max')) && format('["linux", "rolling", "{0}"]', inputs.runner_label || 'max1550') || format('["linux", "gpu", "{0}"]', inputs.runner_label)) }}
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -noprofile --norc -eo pipefail -c "source /opt/intel/oneapi/setvars.sh > /dev/null; source {0}"
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}

      - name: Set artifact name
        id: artifact
        run: |
          echo "name=pytorch-${{ inputs.python_version }}-${{ inputs.runner_label || 'default' }}" | tee -a "$GITHUB_OUTPUT"

      - name: Setup PyTorch
        uses: ./.github/actions/setup-pytorch
        with:
          ref: ${{ inputs.pytorch_ref }}
          lts: ${{ inputs.runner_label == 'lts' }}
          upload_artifact: ${{ steps.artifact.outputs.name }}
