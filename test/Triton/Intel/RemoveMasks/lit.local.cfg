# ruff: noqa: F821
import subprocess

import lit.util

# census-debug: triton-opt accepts -debug-only and the pass emits its census
# trace. Probed rather than inferred from the build type, so tests that need
# the trace report UNSUPPORTED instead of failing where it is compiled out.
_PROBE = """
tt.func @probe(%p: !tt.ptr<f32>, %n: i32) {
  %c0 = arith.constant 0 : i32
  %c1 = arith.constant 1 : i32
  %lane = tt.make_range {start = 0 : i32, end = 4 : i32} : tensor<4xi32>
  %ns = tt.splat %n : i32 -> tensor<4xi32>
  %mask = arith.cmpi slt, %lane, %ns : tensor<4xi32>
  %ps = tt.splat %p : !tt.ptr<f32> -> tensor<4x!tt.ptr<f32>>
  scf.for %i = %c0 to %n step %c1 : i32 {
    %v = tt.load %ps, %mask : tensor<4x!tt.ptr<f32>>
    tt.store %ps, %v : tensor<4x!tt.ptr<f32>>
  }
  tt.return
}
"""

triton_opt = lit.util.which("triton-opt", config.environment["PATH"])
if triton_opt:
    # A broken probe warns and leaves the feature off: this directory-local
    # config must not abort the whole lit run.
    try:
        probe = subprocess.run(
            [triton_opt, "-triton-intel-remove-masks", "-debug-only=triton-intel-remove-masks-census"],
            input=_PROBE, capture_output=True, text=True, errors="replace", timeout=120)
    except (OSError, subprocess.SubprocessError) as e:
        probe = None
        lit_config.warning("census-debug probe did not run: {}".format(e))
    if probe and probe.returncode == 0 and "candidate:" in probe.stderr:
        config.available_features.add("census-debug")
    elif probe and probe.returncode == 0:
        lit_config.note("census-debug unavailable: the probe ran but emitted no census trace")
    elif probe and "Unknown command line argument" in probe.stderr:
        lit_config.note("census-debug unavailable: triton-opt does not support -debug-only")
    elif probe:
        lit_config.warning("census-debug probe failed unexpectedly:\n" + probe.stderr[-2000:])
else:
    lit_config.note("census-debug unavailable: triton-opt not found on PATH")
